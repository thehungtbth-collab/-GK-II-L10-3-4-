  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent1:#6a11cb;--accent2:#2575fc;--muted:#6b7280;--btn-text:#fff}
    html, body { height: 100%; margin: 0; }
    body{font-family:Inter,system-ui,Arial;background:var(--bg);color:#111}
    .wrap{
      max-width:100%;
      width:100%;
      height:100vh;

      padding:18px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;

    .btn-ghost{background:transparent;color:var(--accent2);border:1px solid rgba(37,117,252,0.12);color:var(--accent2);border-radius:10px;padding:8px 12px}
    .btn:hover{transform:translateY(-2px)}
    /* iframe chiếm phần còn lại */
    #frame{flex:1 1 auto;width:100%;min-height:0;border-radius:10px;border:1px solid #e6eef8;background:#fff}
    .meta{color:var(--muted);font-size:13px;margin-top:6px}
    /* fullscreen styles */
    .fullscreen-frame {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9998 !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .hidden { display: none !important; }
    #closeFullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10000;
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: rgba(255,255,255,0.95);
      color: #111;
      font-weight:700;
      box-shadow: 0 6px 18px rgba(16,24,40,0.12);
      cursor: pointer;
    }
    @media (max-width:640px){ .controls{flex-direction:column;align-items:stretch} select{width:100%} }
  </style>

    const items = [{"name":"ĐỀ GK II LỚP 10 (3).html","filename":"ĐỀ GK II LỚP 10 (3).html","content":"<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>English Practice</title><style>\n        :root { --primary: #2563eb; --success: #16a34a; --error: #dc2626; --bg: #f8fafc; --highlight: #fef08a; } body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; line-height: 1.8; } #main { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); } .section-box { margin-bottom: 50px; } .section-title { font-size: 1.4em; font-weight: bold; color: var(--primary); margin: 0 0 15px 0; } .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; } .gap-fill-text { font-size: 1.15em; text-align: justify; line-height: 1.8; } \n        .gap-btn { display: inline; background: transparent; border: none; border-bottom: 1px dotted #94a3b8; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0 2px; margin: 0 2px; font-size: inherit; font-family: inherit; transition: all 0.2s; } .gap-btn:hover { color: #1d4ed8; border-bottom-style: solid; } .gap-btn.filled { border-bottom: none; font-weight: bold; } .gap-btn.correct { color: var(--success) !important; } .gap-btn.wrong { color: var(--error) !important; text-decoration: line-through; }\n        .reading-container { display: flex; height: 650px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background:#fff; } .reading-left { flex: 1; padding: 25px; overflow-y: auto; background: #fff; border-right: 4px solid #f1f5f9; resize: horizontal; overflow-x: hidden; max-width: 70%; min-width: 30%; } .reading-right { flex: 1; padding: 25px; overflow-y: auto; background: #f8fafc; } .reading-left::-webkit-scrollbar, .reading-right::-webkit-scrollbar { width: 8px; } .reading-left::-webkit-scrollbar-track, .reading-right::-webkit-scrollbar-track { background: #f1f1f1; } .reading-left::-webkit-scrollbar-thumb, .reading-right::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } \n        .vocab-highlight { background-color: transparent; border-bottom: 2px dashed #f59e0b; cursor: help; padding: 0 1px; color: inherit; font-weight: 500; transition: all 0.2s; } .vocab-highlight:hover { background-color: #fffbeb; color: #d97706; }\n        .mcq-question { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; } .sortable-list { list-style: none; padding: 0; } .sortable-item { background: #fff; border: 1px solid #cbd5e1; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 15px; } .popover { position: absolute; background: white; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; padding: 10px; z-index: 1000; display: none; min-width: 250px; max-width: 400px; } .popover-option { display: block; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; } .popover-option:hover { background-color: #f8fafc; color: var(--primary); } .vocab-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 400px; border-radius: 16px; z-index: 10000; display: none; border: 1px solid #e2e8f0; overflow:hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); } .vocab-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2em; } .vocab-body { padding: 20px; } .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999; display: none; } button.action-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); } \n        .mcq-options label { display: block; margin: 8px 0; cursor: pointer; padding:8px; border-radius:4px; transition:background 0.2s } .mcq-options label:hover { background-color: #f1f5f9; }\n        .fullscreen-reading { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; } .fullscreen-reading .reading-container { flex: 1; height: auto !important; } .fullscreen-btn { float: right; padding: 5px 10px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; margin-bottom:5px; } .fullscreen-btn:hover { background: #334155; }\n        .btn-game { background: linear-gradient(90deg, #8b5cf6, #d946ef); color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-bottom:20px; }\n        .word-form-input { border: none; border-bottom: 2px solid #94a3b8; background: transparent; padding: 2px 5px; font-size: 1em; color: var(--primary); font-weight: bold; width: 150px; outline: none; transition: 0.3s; text-align: center; } .word-form-input:focus { border-bottom-color: var(--primary); background: #eff6ff; } .word-form-input.correct { border-bottom-color: var(--success); color: var(--success); background: #dcfce7; } .word-form-input.wrong { border-bottom-color: var(--error); color: var(--error); background: #fee2e2; text-decoration: line-through; } .correction-text { display: inline-block; margin-left: 8px; color: var(--success); font-weight: bold; font-size: 0.9em; background: #f0fdf4; padding: 2px 6px; border-radius: 4px; border: 1px solid #bbf7d0; }\n        @media (max-width: 768px) { .reading-container { flex-direction: column; height: auto; } .reading-left { resize: none; max-width: 100%; border-right: none; border-bottom: 4px solid #f1f5f9; max-height: 300px; } .vocab-modal { width: 90%; } }\n        \n        #vocab-game-overlay { position: fixed; inset: 0; z-index: 5000; background: #0f1724; display: none; overflow-y: auto; color: #e6eef6; }\n        #game-container { width:100%; max-width:1200px; margin: 0 auto; padding: 24px; }\n        .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }\n        .game-h1 { font-size:20px; margin:0; color:#06b6d4; }\n        .game-controls { display:flex; gap:8px; align-items:center; }\n        .game-btn { background:linear-gradient(90deg,#0ea5a4,#06b6d4); border:0; color:#042027; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }\n        .game-btn-close { background: #ef4444; color: white; }\n        .game-layout { display:flex; gap:18px; align-items:flex-start; overflow-x:auto; padding-bottom:6px; }\n        .game-card { flex: 0 0 48%; min-width:320px; box-sizing:border-box; padding:12px; background:rgba(255,255,255,0.02); border-radius:12px; border:1px solid rgba(255,255,255,0.03); max-height: calc(100vh - 180px); overflow:auto; }\n        .game-list { display:flex; flex-direction:column; gap:10px; }\n        .game-eng-item, .game-vie-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); color: #e6eef6; }\n        .game-eng-left { display:flex; align-items:center; gap:12px; flex: 0 0 220px; min-width:160px; }\n        .game-index { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; color:#94a3b8; font-weight:700; }\n        .game-slot { flex:1; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.01); border:2px dashed rgba(255,255,255,0.03); min-height:56px; transition:all 220ms ease; cursor:pointer; position:relative; overflow:visible; }\n        .game-slot .inner { position:relative; z-index:3; }\n        .game-slot.correct { padding-left:12px; font-size:15px; display:flex; align-items:center; border-style:solid; border-width:2px; background:linear-gradient(180deg, rgba(16,185,129,0.03), rgba(16,185,129,0.01)); }\n        .game-slot.correct::before { background: linear-gradient(90deg, rgba(16,185,129,0.9), rgba(96,165,250,0.06)); opacity:0.6; filter:blur(10px); }\n        .game-vie-list { display:flex; flex-wrap:wrap; gap:10px; padding-top:6px; }\n        .game-vie-item { cursor:grab; user-select:none; padding:8px 12px; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); }\n        .game-vie-item.dragging { opacity:0.5; transform:scale(0.98); }\n        .game-wrong { animation:shake 300ms; border-color:rgba(239,68,68,0.6); }\n        .game-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.02); color:#94a3b8; font-weight:600; }\n        .game-confetti { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:6000; }\n        .game-confetti .piece { position:absolute; width:10px; height:14px; opacity:0; animation:fall 1200ms linear forwards; }\n        .game-small { font-size:13px; color:#94a3b8; }\n        .flash-wrap { perspective:1200px; width:100%; max-width:520px; }\n        .flashcard { width:100%; height:140px; position:relative; transform-style:preserve-3d; transition:transform 600ms cubic-bezier(.2,.9,.3,1); border-radius:12px; cursor:pointer; }\n        .flashcard.flipped { transform:rotateY(180deg); }\n        .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:18px; font-size:18px; text-align:center; box-shadow: 0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03); }\n        .flash-face.front { background:linear-gradient(180deg, rgba(6,182,212,0.08), rgba(96,165,250,0.03)); color:#e6f9fb; }\n        .flash-face.back { transform:rotateY(180deg); background:linear-gradient(180deg, rgba(16,185,129,0.06), rgba(96,165,250,0.02)); color:#eafff0; }\n        .fill-list { display:flex; flex-direction:column; gap:10px; }\n        .fill-row { display:flex; gap:12px; align-items:center; }\n        .fill-row .vie { flex:0 0 48%; min-width:160px; color:#94a3b8; }\n        .fill-row input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); color:rgba(230,238,246,0.85); transition:all 180ms; }\n        .fill-row input.correct { border-color: rgba(16,185,129,0.7); background: rgba(16,185,129,0.02); }\n        .fill-row input.wrong { border-color: rgba(244,63,94,0.7); background: rgba(244,63,94,0.01); }\n        @keyframes shake{ 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)} }\n        @keyframes fall{ 0%{opacity:1; transform:translateY(-10vh) rotate(0deg)} 100%{opacity:1; transform:translateY(110vh) rotate(720deg)} }\n        @media (max-width:880px){ .game-layout{grid-template-columns:1fr; flex-direction: column;} .game-card{flex-basis:100%; width:100%;} }\n        \n        </style></head>\n        <body>\n        <div id=\"main\">\n            <button class=\"btn-game\" onclick=\"openVocabGame()\">🎮 Play Vocab Game</button>\n            <h1>English Practice Test</h1>\n            <div class=\"section-box\"><h3 class=\"section-title\">Part 1: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\">Architecting Tomorrow's Global Partnerships<br>        The <span class=\"vocab-highlight\" onclick=\"showVocabDef('innovative')\">innovative</span> Vietnamese economy transforms challenges into opportunities with  <span class=\"gap-btn\" id=\"gap-1-1\" onclick=\"showGapOptions(event, '1', '1')\">(1)</span>  resilience. The sophisticated  <span class=\"gap-btn\" id=\"gap-1-2\" onclick=\"showGapOptions(event, '1', '2')\">(2)</span>  transformation accelerates Vietnam's development. The entrepreneurs  <span class=\"gap-btn\" id=\"gap-1-3\" onclick=\"showGapOptions(event, '1', '3')\">(3)</span>  sustainable solutions have attracted worldwide attention. Vietnam's <span class=\"vocab-highlight\" onclick=\"showVocabDef('innovative')\">innovative</span> policies present multinational corporations  <span class=\"gap-btn\" id=\"gap-1-4\" onclick=\"showGapOptions(event, '1', '4')\">(4)</span>  game-changing <span class=\"vocab-highlight\" onclick=\"showVocabDef('investment')\">investment</span> possibilities. Vietnam is  <span class=\"gap-btn\" id=\"gap-1-5\" onclick=\"showGapOptions(event, '1', '5')\">(5)</span>  out all the stops to create a business-friendly environment. We are committed  <span class=\"gap-btn\" id=\"gap-1-6\" onclick=\"showGapOptions(event, '1', '6')\">(6)</span>  our global reach while continuing to strengthen domestic capabilities.<br></div></div><div class=\"section-box\"><h3 class=\"section-title\">Part 2: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\">Learning in the 5th Dimension<br>        While certain learning methods remain conventional,  <span class=\"gap-btn\" id=\"gap-2-7\" onclick=\"showGapOptions(event, '2', '7')\">(7)</span>  have transcended into quantum-based approaches, with another breakthrough emerging in neural plasticity research. Our <span class=\"vocab-highlight\" onclick=\"showVocabDef('innovative')\">innovative</span> program  <span class=\"gap-btn\" id=\"gap-2-8\" onclick=\"showGapOptions(event, '2', '8')\">(8)</span>  transform conventional education through multidimensional learning techniques. The paradigm  <span class=\"gap-btn\" id=\"gap-2-9\" onclick=\"showGapOptions(event, '2', '9')\">(9)</span>  in cognitive enhancement demonstrates unprecedented results.  <span class=\"gap-btn\" id=\"gap-2-10\" onclick=\"showGapOptions(event, '2', '10')\">(10)</span>  the latest neuroscientific research, our methodology integrates multiple learning pathways. The synergy between artificial intelligence and human  <span class=\"gap-btn\" id=\"gap-2-11\" onclick=\"showGapOptions(event, '2', '11')\">(11)</span>  creates a groundbreaking learning ecosystem. A  <span class=\"gap-btn\" id=\"gap-2-12\" onclick=\"showGapOptions(event, '2', '12')\">(12)</span>  of evidence supports our revolutionary approach.<br></div></div><div class=\"section-box\"><h3 class=\"section-title\">Part 3: Sentence Rearrangement</h3><div style=\"margin-bottom:30px\"><strong>Question 13.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-13\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> Sarah. Hey, did you know my grandmother just started a TikTok channel about knitting?</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> Sarah. She does these really cool time-lapse videos of her knitting projects. But the funny part is she adds heavy metal music as background!</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> Marcus. No way! What kind of content does she make?</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('13', 'c,a,b')\">Check</button><span id=\"fb-13\" style=\"margin-left:10px\"></span><div id=\"ans-13\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: c - a - b</div></div><div style=\"margin-bottom:30px\"><strong>Question 14.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-14\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> Tom. Hey, I've been meaning to ask—what's with the tiny greenhouse on your desk?</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> Maya. proudly Yep! It takes about 7 days from seed to harvest. I just snip what I need each day. Saves money and they're super fresh.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> Tom. Wait, you're telling me those tiny plants in there are actually your lunch?</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> Maya. Oh, that! It's my new \"lunch garden.\" I'm growing microgreens for my sandwiches right at my workspace.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> Tom. That's actually genius! But doesn't your boss mind having a mini farm on your desk?</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('14', 'd,a,e,c,b')\">Check</button><span id=\"fb-14\" style=\"margin-left:10px\"></span><div id=\"ans-14\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: d - a - e - c - b</div></div><div style=\"margin-bottom:30px\"><strong>Question 15.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-15\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> Another student from Brazil was there too, and we practiced conversing while exploring the tea house garden. Even though we made plenty of mistakes, it felt so natural learning this way.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> The most surreal part? When I took off my VR headset, I realized I'd been \"in Japan\" for two hours and somehow learned more Japanese than I did in a month of traditional classes. Technology is wild, isn't it? I can't wait to tell you about next week's lesson—we're going to a virtual Tokyo fish market!</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> By the way, how's your AI music theory tutor working out? Still helping you compose those personalized practice pieces?</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> Instead of just memorizing phrases from a textbook, I actually had to participate in a tea ceremony—in Japanese! My virtual tea master was so patient, correcting my pronunciation while I awkwardly tried to remember the proper way to hold the tea bowl.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> You won't believe what happened in my virtual reality language class today! Remember how I told you I was trying that new VR language learning program? Well, today we had a \"virtual field trip\" to a traditional Japanese tea house.</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('15', 'c,b,d,a,e')\">Check</button><span id=\"fb-15\" style=\"margin-left:10px\"></span><div id=\"ans-15\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: c - b - d - a - e</div></div><div style=\"margin-bottom:30px\"><strong>Question 16.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-16\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> Our mentorship program took an <span class=\"vocab-highlight\" onclick=\"showVocabDef('innovative')\">innovative</span> turn by matching people based purely on skills and goals. A junior male designer paired with a senior female developer created one of our most successful mentoring relationships, challenging traditional assumptions.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> In our tech startup, we introduced \"blind code reviews\" where all code submissions are anonymous. This simple change revealed that brilliant solutions came from unexpected team members, proving that talent has no gender.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> Our office culture shifted dramatically. Daily meetings became more inclusive, with junior members speaking up confidently. The old hierarchy faded, replaced by a system where good ideas matter more than who presents them.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> At home, my partner and I stopped labeling chores as \"male\" or \"female\" tasks. This shift led to surprising discoveries—they're an amazing cook, while I excel at fixing things. Breaking free from gender roles opened new possibilities for both of us.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> By using AI tools to screen resumes without personal information, our hiring process now focuses purely on talent. The result? A naturally diverse team built on merit, where equality isn't just a goal—it's our daily reality.</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('16', 'b,e,a,d,c')\">Check</button><span id=\"fb-16\" style=\"margin-left:10px\"></span><div id=\"ans-16\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: b - e - a - d - c</div></div><div style=\"margin-bottom:30px\"><strong>Question 17.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-17\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> Working with the World Health Organization (WHO) during the pandemic revealed our strength. Vietnam's success in combining high-tech tracking systems with community-based healthcare became a model for other developing nations, earning recognition from global health experts.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> Our partnership with the World Trade Organization (WTO) opened unexpected doors. Local coffee farmers in Đắk Lắk now sell directly to European markets through e-commerce platforms, while young tech startups in Hanoi collaborate with Silicon Valley mentors, showing how global integration creates everyday opportunities.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> Vietnam's path in ASEAN has evolved remarkably. From a newcomer in 1995 to hosting major summits today, our nation has <span class=\"vocab-highlight\" onclick=\"showVocabDef('transformed')\">transformed</span> from a quiet member into an active voice in Southeast Asian affairs, particularly in digital economy initiatives.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> The United Nations Development Programme (UNDP) collaboration has taken an <span class=\"vocab-highlight\" onclick=\"showVocabDef('innovative')\">innovative</span> turn. In the Mekong Delta, traditional farmers now use AI-powered apps to predict flooding and adjust planting schedules. This blend of ancient farming wisdom and modern technology showcases Vietnam's <span class=\"vocab-highlight\" onclick=\"showVocabDef('unique')\">unique</span> approach to development.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> Our recent leadership in international climate initiatives demonstrates growth. From pioneering green energy projects in Phú Quốc to leading discussions on sustainable development at COP26, Vietnam has evolved from a participant to a contributor in global environmental solutions.</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('17', 'd,b,e,c,a')\">Check</button><span id=\"fb-17\" style=\"margin-left:10px\"></span><div id=\"ans-17\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: d - b - e - c - a</div></div></div><div class=\"section-box\"><h3 class=\"section-title\">Part 4: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\">In today's rapidly evolving society,  <span class=\"gap-btn\" id=\"gap-4-18\" onclick=\"showGapOptions(event, '4', '18')\">(18)</span> . The barriers that once divided communities based on gender, race, and social status are gradually being dismantled, though much work remains to be done. Had society recognized the importance of equality earlier, many historical injustices could have been prevented.<br>The digital revolution,  <span class=\"gap-btn\" id=\"gap-4-19\" onclick=\"showGapOptions(event, '4', '19')\">(19)</span> , has become a powerful catalyst for promoting equality and understanding. Breaking down systemic barriers requires not only legislative changes but also a fundamental shift in societal attitudes; furthermore, it demands active participation from individuals and institutions alike.<br> <span class=\"gap-btn\" id=\"gap-4-20\" onclick=\"showGapOptions(event, '4', '20')\">(20)</span>  and opportunities for marginalized groups, while simultaneously educating the public about unconscious biases and privilege. Recognizing the urgency of addressing inequality and  <span class=\"gap-btn\" id=\"gap-4-21\" onclick=\"showGapOptions(event, '4', '21')\">(21)</span> .<br>Countless discriminatory practices  <span class=\"gap-btn\" id=\"gap-4-22\" onclick=\"showGapOptions(event, '4', '22')\">(22)</span> . The path toward true equality may be long and challenging, but each step forward brings us closer to a world where everyone has access to the same opportunities, regardless of their background. As we continue to break chains and build bridges, the promise of a more <span class=\"vocab-highlight\" onclick=\"showVocabDef('equitable')\">equitable</span> future becomes not just a possibility but an achievable reality. This transformative journey requires unwavering dedication, compassion, and the collective will to challenge and change deeply rooted societal norms. Through education and persistent advocacy, we can create lasting change that transcends generations.<br></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 5: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-5\"><div class=\"reading-left\">Vietnam's <span class=\"vocab-highlight\" onclick=\"showVocabDef('emergence')\">emergence</span> as a significant player in the global business landscape has been remarkable. Over the past decade, this Southeast Asian nation has <span class=\"vocab-highlight\" onclick=\"showVocabDef('transformed')\">transformed</span> from a <b>primarily</b> agricultural economy into a <span class=\"vocab-highlight\" onclick=\"showVocabDef('dynamic')\">dynamic</span> hub for manufacturing and technology. Major corporations like Samsung, Intel, and Apple have established substantial <span class=\"vocab-highlight\" onclick=\"showVocabDef('operations')\">operations</span> in Vietnam, attracted by its skilled workforce, <span class=\"vocab-highlight\" onclick=\"showVocabDef('competitive')\">competitive</span> labor costs, and strategic location within the Asia-Pacific region.<br><br>The country's success in attracting foreign <span class=\"vocab-highlight\" onclick=\"showVocabDef('investment')\">investment</span> stems from <b>its</b> <span class=\"vocab-highlight\" onclick=\"showVocabDef('commitment')\">commitment</span> to economic <span class=\"vocab-highlight\" onclick=\"showVocabDef('reforms')\">reforms</span>. Vietnamese authorities have implemented policies to <span class=\"vocab-highlight\" onclick=\"showVocabDef('streamline')\">streamline</span> business <span class=\"vocab-highlight\" onclick=\"showVocabDef('procedures')\">procedures</span> and enhance <span class=\"vocab-highlight\" onclick=\"showVocabDef('transparency')\">transparency</span>. Additionally, significant investments in education have produced a young, tech-<span class=\"vocab-highlight\" onclick=\"showVocabDef('savvy')\">savvy</span> workforce capable of meeting global organizations' requirements. This combination of <span class=\"vocab-highlight\" onclick=\"showVocabDef('favorable')\">favorable</span> policies and human capital development has <span class=\"vocab-highlight\" onclick=\"showVocabDef('positioned')\">positioned</span> Vietnam as an attractive alternative to traditional manufacturing powerhouses in the region.<br><br>What sets Vietnam apart is its <span class=\"vocab-highlight\" onclick=\"showVocabDef('unique')\">unique</span> approach to international business integration. Rather than simply serving as a manufacturing base, the country has actively pursued knowledge transfer and technological advancement. Vietnamese companies are increasingly <span class=\"vocab-highlight\" onclick=\"showVocabDef('partnering')\">partnering</span> with global <b>firms</b> to develop <span class=\"vocab-highlight\" onclick=\"showVocabDef('innovative')\">innovative</span> solutions and cutting-edge technologies. The government's emphasis on digital transformation has accelerated this trend, making Vietnam an important player in the global digital economy and international trade networks.<br><br>The impact of Vietnam's rise extends beyond economic metrics. <b>The country's growing influence has prompted global organizations to <span class=\"vocab-highlight\" onclick=\"showVocabDef('reassess')\">reassess</span> their strategies</b>. Many companies now view Vietnam not just as a production hub but as a crucial market for future growth. This shift has led to increased <span class=\"vocab-highlight\" onclick=\"showVocabDef('investment')\">investment</span> in research facilities and innovation labs across the country. As Vietnam continues to <span class=\"vocab-highlight\" onclick=\"showVocabDef('evolve')\">evolve</span>, its role in reshaping global business practices becomes more <span class=\"vocab-highlight\" onclick=\"showVocabDef('pronounced')\">pronounced</span> and influential in the international business community.<br><br></div><div class=\"reading-right\"><div class=\"mcq-question\"><b>Question 23.</b> Which of the following is NOT mentioned as a factor contributing to Vietnam's economic growth?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q23\" value=\"A\" onchange=\"checkMCQ('5', '23', 'A')\"> A. Skilled workforce availability</label><label><input type=\"radio\" name=\"q23\" value=\"B\" onchange=\"checkMCQ('5', '23', 'B')\"> B. Strategic location in Asia-Pacific</label><label><input type=\"radio\" name=\"q23\" value=\"C\" onchange=\"checkMCQ('5', '23', 'C')\"> C. Government policies for business reform</label><label><input type=\"radio\" name=\"q23\" value=\"D\" onchange=\"checkMCQ('5', '23', 'D')\"> D. Agricultural modernization programs</label></div><div id=\"res-5-23\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 24.</b> The word “primarily” in paragraph 1 is OPPOSTIE in meaning to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q24\" value=\"A\" onchange=\"checkMCQ('5', '24', 'A')\"> A. mainly</label><label><input type=\"radio\" name=\"q24\" value=\"B\" onchange=\"checkMCQ('5', '24', 'B')\"> B. chiefly</label><label><input type=\"radio\" name=\"q24\" value=\"C\" onchange=\"checkMCQ('5', '24', 'C')\"> C. secondarily</label><label><input type=\"radio\" name=\"q24\" value=\"D\" onchange=\"checkMCQ('5', '24', 'D')\"> D. predominantly</label></div><div id=\"res-5-24\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 25.</b> The word “its” in paragraph 2 refers to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q25\" value=\"A\" onchange=\"checkMCQ('5', '25', 'A')\"> A. foreign investment</label><label><input type=\"radio\" name=\"q25\" value=\"B\" onchange=\"checkMCQ('5', '25', 'B')\"> B. success</label><label><input type=\"radio\" name=\"q25\" value=\"C\" onchange=\"checkMCQ('5', '25', 'C')\"> C. Vietnam's</label><label><input type=\"radio\" name=\"q25\" value=\"D\" onchange=\"checkMCQ('5', '25', 'D')\"> D. economic reforms</label></div><div id=\"res-5-25\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 26.</b> The word “firms” in paragraph 3 could be best replaced by_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q26\" value=\"A\" onchange=\"checkMCQ('5', '26', 'A')\"> A. businesses</label><label><input type=\"radio\" name=\"q26\" value=\"B\" onchange=\"checkMCQ('5', '26', 'B')\"> B. workers</label><label><input type=\"radio\" name=\"q26\" value=\"C\" onchange=\"checkMCQ('5', '26', 'C')\"> C. factories</label><label><input type=\"radio\" name=\"q26\" value=\"D\" onchange=\"checkMCQ('5', '26', 'D')\"> D. products</label></div><div id=\"res-5-26\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 27.</b> Which of the following best paraphrases the underlined sentence in paragraph 4?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q27\" value=\"A\" onchange=\"checkMCQ('5', '27', 'A')\"> A. World companies have chosen to invest more funds due to Vietnam's economic stability.</label><label><input type=\"radio\" name=\"q27\" value=\"B\" onchange=\"checkMCQ('5', '27', 'B')\"> B. Global firms have decided to review their plans due to Vietnam's increasing power in trade.</label><label><input type=\"radio\" name=\"q27\" value=\"C\" onchange=\"checkMCQ('5', '27', 'C')\"> C. International groups have moved their factories as Vietnam offers cheaper labor costs.</label><label><input type=\"radio\" name=\"q27\" value=\"D\" onchange=\"checkMCQ('5', '27', 'D')\"> D. Foreign businesses have started new projects due to Vietnam's technological advances.</label></div><div id=\"res-5-27\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 28.</b> Which of the following is TRUE according to the passage?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q28\" value=\"A\" onchange=\"checkMCQ('5', '28', 'A')\"> A. Vietnam has transformed its economy from agriculture to technology and manufacturing in recent years.</label><label><input type=\"radio\" name=\"q28\" value=\"B\" onchange=\"checkMCQ('5', '28', 'B')\"> B. Vietnam's success in global trade comes mainly from its geographical location and natural resources.</label><label><input type=\"radio\" name=\"q28\" value=\"C\" onchange=\"checkMCQ('5', '28', 'C')\"> C. The Vietnamese government focuses solely on attracting foreign companies for manufacturing purposes.</label><label><input type=\"radio\" name=\"q28\" value=\"D\" onchange=\"checkMCQ('5', '28', 'D')\"> D. Vietnam's role in international business remains limited to providing low-cost labor for corporations.</label></div><div id=\"res-5-28\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 29.</b> In which paragraph does the writer mention implemented policies to streamline business procedures and enhance transparency?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q29\" value=\"A\" onchange=\"checkMCQ('5', '29', 'A')\"> A. Paragraph 3</label><label><input type=\"radio\" name=\"q29\" value=\"B\" onchange=\"checkMCQ('5', '29', 'B')\"> B. Paragraph 1</label><label><input type=\"radio\" name=\"q29\" value=\"C\" onchange=\"checkMCQ('5', '29', 'C')\"> C. Paragraph 2</label><label><input type=\"radio\" name=\"q29\" value=\"D\" onchange=\"checkMCQ('5', '29', 'D')\"> D. Paragraph 4</label></div><div id=\"res-5-29\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 30.</b> In which paragraph does the writer mention Vietnam's broader influence on global business strategies?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q30\" value=\"A\" onchange=\"checkMCQ('5', '30', 'A')\"> A. Paragraph 1</label><label><input type=\"radio\" name=\"q30\" value=\"B\" onchange=\"checkMCQ('5', '30', 'B')\"> B. Paragraph 2</label><label><input type=\"radio\" name=\"q30\" value=\"C\" onchange=\"checkMCQ('5', '30', 'C')\"> C. Paragraph 3</label><label><input type=\"radio\" name=\"q30\" value=\"D\" onchange=\"checkMCQ('5', '30', 'D')\"> D. Paragraph 4</label></div><div id=\"res-5-30\" style=\"margin-top:5px\"></div></div></div></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 6: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-6\"><div class=\"reading-left\">While the world continues to <b>turn a blind eye</b>, gender inequality remains one of the most persistent and costly barriers to economic growth and social development worldwide. Despite significant progress in recent decades, women continue to face <span class=\"vocab-highlight\" onclick=\"showVocabDef('discrimination')\">discrimination</span> in education, employment, and leadership positions. The World Bank estimates that countries are losing $160 trillion in wealth due to differences in lifetime <span class=\"vocab-highlight\" onclick=\"showVocabDef('earnings')\">earnings</span> between women and men. This <span class=\"vocab-highlight\" onclick=\"showVocabDef('staggering')\">staggering</span> figure represents not just a moral failure but a massive economic <span class=\"vocab-highlight\" onclick=\"showVocabDef('blindspot')\">blindspot</span> that affects everyone.<br><br><b>[I]</b>In the workplace, women face numerous challenges that limit their potential and contribution to the economy. <b>[II]</b> Women are also <span class=\"vocab-highlight\" onclick=\"showVocabDef('underrepresented')\">underrepresented</span> in leadership positions, holding only 29% of senior management roles globally. <b>[III]</b>Furthermore, they shoulder a <span class=\"vocab-highlight\" onclick=\"showVocabDef('disproportionate')\">disproportionate</span> share of unpaid care work, which limits their ability to participate fully in the formal economy. These barriers not only affect individual women but also impact organizational performance and innovation. <b>[IV]</b><br><br>The impact of gender inequality extends far beyond the workplace into education and <span class=\"vocab-highlight\" onclick=\"showVocabDef('entrepreneurship')\">entrepreneurship</span>. In many developing countries, girls still face significant barriers to accessing quality education, with millions out of school due to cultural norms, <b>poverty</b>, or safety <span class=\"vocab-highlight\" onclick=\"showVocabDef('concerns')\">concerns</span>. When it comes to <span class=\"vocab-highlight\" onclick=\"showVocabDef('entrepreneurship')\">entrepreneurship</span>, women often <span class=\"vocab-highlight\" onclick=\"showVocabDef('struggle')\">struggle</span> to access finance and business networks. Studies show that women-owned businesses receive only 3% of venture capital funding, despite evidence that companies with gender-diverse leadership perform better financially.<br><br>Addressing gender inequality requires a <span class=\"vocab-highlight\" onclick=\"showVocabDef('comprehensive')\">comprehensive</span> approach involving governments, businesses, and society at large. <b>This includes implementing policies to ensure equal pay and opportunities, providing access to quality education and healthcare, and challenging cultural norms that <span class=\"vocab-highlight\" onclick=\"showVocabDef('perpetuate')\">perpetuate</span> <span class=\"vocab-highlight\" onclick=\"showVocabDef('discrimination')\">discrimination</span></b>. Companies that actively promote gender diversity not only contribute to social justice but also benefit from increased innovation, better decision-making, and improved financial performance. The cost of inaction is simply too high to ignore. By investing in women's equality today, we can create a more <span class=\"vocab-highlight\" onclick=\"showVocabDef('prosperous')\">prosperous</span> and <span class=\"vocab-highlight\" onclick=\"showVocabDef('equitable')\">equitable</span> future for generations to come, making it not just a moral <span class=\"vocab-highlight\" onclick=\"showVocabDef('imperative')\">imperative</span> but a smart economic decision.<br><br></div><div class=\"reading-right\"><div class=\"mcq-question\"><b>Question 31.</b> The phrase “turn a blind eye” in paragraph 1 could be best replaced by_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q31\" value=\"A\" onchange=\"checkMCQ('6', '31', 'A')\"> A. overlook</label><label><input type=\"radio\" name=\"q31\" value=\"B\" onchange=\"checkMCQ('6', '31', 'B')\"> B. look down on</label><label><input type=\"radio\" name=\"q31\" value=\"C\" onchange=\"checkMCQ('6', '31', 'C')\"> C. look up to</label><label><input type=\"radio\" name=\"q31\" value=\"D\" onchange=\"checkMCQ('6', '31', 'D')\"> D. look after</label></div><div id=\"res-6-31\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 32.</b> Where in paragraph 2 does the following sentence best fit?\nThey are often paid less than men for the same work, with the global gender pay gap averaging 20%.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q32\" value=\"A\" onchange=\"checkMCQ('6', '32', 'A')\"> A. [I]</label><label><input type=\"radio\" name=\"q32\" value=\"B\" onchange=\"checkMCQ('6', '32', 'B')\"> B. [II]</label><label><input type=\"radio\" name=\"q32\" value=\"C\" onchange=\"checkMCQ('6', '32', 'C')\"> C. [III]</label><label><input type=\"radio\" name=\"q32\" value=\"D\" onchange=\"checkMCQ('6', '32', 'D')\"> D. [IV]</label></div><div id=\"res-6-32\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 33.</b> The word “their” in paragraph 2 refers to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q33\" value=\"A\" onchange=\"checkMCQ('6', '33', 'A')\"> A. men</label><label><input type=\"radio\" name=\"q33\" value=\"B\" onchange=\"checkMCQ('6', '33', 'B')\"> B. countries</label><label><input type=\"radio\" name=\"q33\" value=\"C\" onchange=\"checkMCQ('6', '33', 'C')\"> C. women</label><label><input type=\"radio\" name=\"q33\" value=\"D\" onchange=\"checkMCQ('6', '33', 'D')\"> D. organizations</label></div><div id=\"res-6-33\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 34.</b> Which of the following is NOT mentioned as a barrier for women in the workplace?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q34\" value=\"A\" onchange=\"checkMCQ('6', '34', 'A')\"> A. sexual harassment</label><label><input type=\"radio\" name=\"q34\" value=\"B\" onchange=\"checkMCQ('6', '34', 'B')\"> B. lower pay compared to men</label><label><input type=\"radio\" name=\"q34\" value=\"C\" onchange=\"checkMCQ('6', '34', 'C')\"> C. underrepresentation in leadership positions</label><label><input type=\"radio\" name=\"q34\" value=\"D\" onchange=\"checkMCQ('6', '34', 'D')\"> D. disproportionate share of unpaid care work</label></div><div id=\"res-6-34\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 35.</b> Which of the following best summarises the paragraph 3?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q35\" value=\"A\" onchange=\"checkMCQ('6', '35', 'A')\"> A. Cultural norms and safety concerns prevent women from accessing education and starting successful business ventures.</label><label><input type=\"radio\" name=\"q35\" value=\"B\" onchange=\"checkMCQ('6', '35', 'B')\"> B. Educational barriers and financial constraints limit women's access to both academic and business opportunities globally.</label><label><input type=\"radio\" name=\"q35\" value=\"C\" onchange=\"checkMCQ('6', '35', 'C')\"> C. Women face discrimination in schools and business sectors despite their proven success in leadership positions.</label><label><input type=\"radio\" name=\"q35\" value=\"D\" onchange=\"checkMCQ('6', '35', 'D')\"> D. Poverty and lack of networks affect women's advancement in both educational and entrepreneurial endeavors.</label></div><div id=\"res-6-35\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 36.</b> The word “poverty” in paragraph 3 is OPPOSITE in meaning to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q36\" value=\"A\" onchange=\"checkMCQ('6', '36', 'A')\"> A. scarcity</label><label><input type=\"radio\" name=\"q36\" value=\"B\" onchange=\"checkMCQ('6', '36', 'B' ersity and inclusion programs\",\"D\":\"to commit to meaningful change, inclusion initiatives have implemented through many corporations\"},\"4-22\":{\"A\":\"which are challenged and reformed by grassroots movements, legal advocacy, and social media campaigns that they organize\",\"B\":\"that being challenged and reformed through grassroots movements, where legal advocacy and social media campaigns operate\",\"C\":\"are being challenged and reformed through grassroots movements, legal advocacy, and social media campaigns\",\"D\":\"having challenged and reformed through grassroots movements, legal advocacy, and social media campaigns\"}},\"vocabMap\": {\n    \"emergence\": {\n      \"original\": \"emergence\",\n      \"meaning\": \"sự nổi lên, sự xuất hiện\",\n      \"synonyms\": \"arrival, rise, advent\",\n      \"example\": \"The emergence of new technologies has changed how we work.\"\n    },\n    \"transformed\": {\n      \"original\": \"transformed\",\n      \"meaning\": \"thay đổi hoàn toàn, biến đổi\",\n      \"synonyms\": \"altered, converted, revamped\",\n      \"example\": \"The old warehouse was transformed into a modern art gallery.\"\n    },\n    \"dynamic\": {\n      \"original\": \"dynamic\",\n      \"meaning\": \"năng động, luôn biến đổi\",\n      \"synonyms\": \"energetic, vibrant, fluid\",\n      \"example\": \"We operate in a dynamic market that requires quick adaptation.\"\n    },\n    \"operations\": {\n      \"original\": \"operations\",\n      \"meaning\": \"hoạt động (kinh doanh/vận hành)\",\n      \"synonyms\": \"activities, processes, running\",\n      \"example\": \"The company is expanding its retail operations in Asia.\"\n    },\n    \"competitive\": {\n      \"original\": \"competitive\",\n      \"meaning\": \"có tính cạnh tranh\",\n      \"synonyms\": \"ambitious, aggressive, rival\",\n      \"example\": \"To stay competitive, businesses must innovate constantly.\"\n    },\n    \"investment\": {\n      \"original\": \"investment\",\n      \"meaning\": \"sự đầu tư\",\n      \"synonyms\": \"funding, capital, asset\",\n      \"example\": \"Real estate is often seen as a safe long-term investment.\"\n    },\n    \"commitment\": {\n      \"original\": \"commitment\",\n      \"meaning\": \"sự cam kết, tận tụy\",\n      \"synonyms\": \"dedication, pledge, promise\",\n      \"example\": \"We admire your commitment to finishing the project on time.\"\n    },\n    \"reforms\": {\n      \"original\": \"reforms\",\n      \"meaning\": \"các cuộc cải cách\",\n      \"synonyms\": \"improvements, amendments, overhaul\",\n      \"example\": \"The government announced economic reforms to boost growth.\"\n    },\n    \"streamline\": {\n      \"original\": \"streamline\",\n      \"meaning\": \"tối ưu hóa, tinh giản\",\n      \"synonyms\": \"optimize, simplify, refine\",\n      \"example\": \"We need to streamline our workflow to save time.\"\n    },\n    \"procedures\": {\n      \"original\": \"procedures\",\n      \"meaning\": \"quy trình, thủ tục\",\n      \"synonyms\": \"steps, protocols, routines\",\n      \"example\": \"All staff must follow the safety procedures strictly.\"\n    },\n    \"transparency\": {\n      \"original\": \"transparency\",\n      \"meaning\": \"sự minh bạch\",\n      \"synonyms\": \"clarity, openness, honesty\",\n      \"example\": \"There is a need for more transparency in the banking sector.\"\n    },\n    \"savvy\": {\n      \"original\": \"savvy\",\n      \"meaning\": \"hiểu biết, am tường\",\n      \"synonyms\": \"knowledgeable, shrewd, sharp\",\n      \"example\": \"She is a tech-savvy entrepreneur who scales businesses fast.\"\n    },\n    \"favorable\": {\n      \"original\": \"favorable\",\n      \"meaning\": \"thuận lợi\",\n      \"synonyms\": \"advantageous, beneficial, positive\",\n      \"example\": \"The current market conditions are favorable for new startups.\"\n    },\n    \"positioned\": {\n      \"original\": \"positioned\",\n      \"meaning\": \"được đặt vào vị thế\",\n      \"synonyms\": \"placed, situated, arrayed\",\n      \"example\": \"The brand is well-positioned to lead the luxury market.\"\n    },\n    \"unique\": {\n      \"original\": \"unique\",\n      \"meaning\": \"duy nhất, độc đáo\",\n      \"synonyms\": \"distinctive, one-of-a-kind, rare\",\n      \"example\": \"This product offers a unique solution to a common problem.\"\n    },\n    \"partnering\": {\n      \"original\": \"partnering\",\n      \"meaning\": \"hợp tác, cộng tác\",\n      \"synonyms\": \"collaborating, teaming up, associating\",\n      \"example\": \"Partnering with local firms helped us enter the new market.\"\n    },\n    \"innovative\": {\n      \"original\": \"innovative\",\n      \"meaning\": \"đột phá, sáng tạo\",\n      \"synonyms\": \"creative, groundbreaking, original\",\n      \"example\": \"Her innovative approach to design won several awards.\"\n    },\n    \"reassess\": {\n      \"original\": \"reassess\",\n      \"meaning\": \"đánh giá lại\",\n      \"synonyms\": \"re-evaluate, reconsider, review\",\n      \"example\": \"We need to reassess our strategy after the recent losses.\"\n    },\n    \"evolve\": {\n      \"original\": \"evolve\",\n      \"meaning\": \"phát triển, tiến hóa\",\n      \"synonyms\": \"develop, progress, grow\",\n      \"example\": \"The software continues to evolve based on user feedback.\"\n    },\n    \"pronounced\": {\n      \"original\": \"pronounced\",\n      \"meaning\": \"rõ rệt, đáng kể\",\n      \"synonyms\": \"noticeable, distinct, marked\",\n      \"example\": \"There has been a pronounced shift in consumer behavior.\"\n    },\n    \"discrimination\": {\n      \"original\": \"discrimination\",\n      \"meaning\": \"sự phân biệt đối xử\",\n      \"synonyms\": \"bias, prejudice, unfairness\",\n      \"example\": \"Laws exist to prevent discrimination in the workplace.\"\n    },\n    \"earnings\": {\n      \"original\": \"earnings\",\n      \"meaning\": \"thu nhập, lợi nhuận\",\n      \"synonyms\": \"income, profit, revenue\",\n      \"example\": \"The company's earnings increased by 20% this quarter.\"\n    },\n    \"staggering\": {\n      \"original\": \"staggering\",\n      \"meaning\": \"gây sửng sốt, kinh ngạc\",\n      \"synonyms\": \"astonishing, shocking, massive\",\n      \"example\": \"The cost of the project was a staggering $5 billion.\"\n    },\n    \"blindspot\": {\n      \"original\": \"blindspot\",\n      \"meaning\": \"điểm mù (vấn đề chưa nhận ra)\",\n      \"synonyms\": \"oversight, ignorance, weakness\",\n      \"example\": \"Management had a blindspot regarding employee morale.\"\n    },\n    \"underrepresented\": {\n      \"original\": \"underrepresented\",\n      \"meaning\": \"không được đại diện đầy đủ\",\n      \"synonyms\": \"underserved, marginalized\",\n      \"example\": \"Women are still underrepresented in STEM fields.\"\n    },\n    \"disproportionate\": {\n      \"original\": \"disproportionate\",\n      \"meaning\": \"không cân xứng\",\n      \"synonyms\": \"uneven, lopsided, unfair\",\n      \"example\": \"The poor spend a disproportionate amount of income on food.\"\n    },\n    \"entrepreneurship\": {\n      \"original\": \"entrepreneurship\",\n      \"meaning\": \"tinh thần/hoạt động khởi nghiệp\",\n      \"synonyms\": \"business enterprise, venturing\",\n      \"example\": \"The university offers courses to encourage entrepreneurship.\"\n    },\n    \"concerns\": {\n      \"original\": \"concerns\",\n      \"meaning\": \"sự lo ngại, vấn đề quan tâm\",\n      \"synonyms\": \"worries, issues, interests\",\n      \"example\": \"Environmental concerns are now a priority for voters.\"\n    },\n    \"struggle\": {\n      \"original\": \"struggle\",\n      \"meaning\": \"sự đấu tranh, khó khăn\",\n      \"synonyms\": \"fight, battle, endeavor\",\n      \"example\": \"Many small businesses struggle to survive during a recession.\"\n    },\n    \"comprehensive\": {\n      \"original\": \"comprehensive\",\n      \"meaning\": \"toàn diện, đầy đủ\",\n      \"synonyms\": \"thorough, all-inclusive, complete\",\n      \"example\": \"We provide a comprehensive training program for new staff.\"\n    },\n    \"perpetuate\": {\n      \"original\": \"perpetuate\",\n      \"meaning\": \"duy trì, làm cho kéo dài mãi\",\n      \"synonyms\": \"maintain, preserve, sustain\",\n      \"example\": \"These myths only perpetuate negative stereotypes.\"\n    },\n    \"prosperous\": {\n      \"original\": \"prosperous\",\n      \"meaning\": \"thịnh vượng, phồn vinh\",\n      \"synonyms\": \"wealthy, flourishing, thriving\",\n      \"example\": \"We wish you a happy and prosperous New Year.\"\n    },\n    \"equitable\": {\n      \"original\": \"equitable\",\n      \"meaning\": \"công bằng, bình đẳng\",\n      \"synonyms\": \"fair, just, impartial\",\n      \"example\": \"We aim to create a more equitable society for everyone.\"\n    },\n    \"imperative\": {\n      \"original\": \"imperative\",\n      \"meaning\": \"cấp bách, mang tính bắt buộc\",\n      \"synonyms\": \"vital, crucial, essential\",\n      \"example\": \"It is imperative that we act now to stop climate change.\"\n    }},\"htmlContent\":\"<div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 1: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">Architecting Tomorrow's Global Partnerships<br>        The <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('innovative')\\\">innovative</span> Vietnamese economy transforms challenges into opportunities with  <span class=\\\"gap-btn\\\" id=\\\"gap-1-1\\\" onclick=\\\"showGapOptions(event, '1', '1')\\\">(1)</span>  resilience. The sophisticated  <span class=\\\"gap-btn\\\" id=\\\"gap-1-2\\\" onclick=\\\"showGapOptions(event, '1', '2')\\\">(2)</span>  transformation accelerates Vietnam's development. The entrepreneurs  <span class=\\\"gap-btn\\\" id=\\\"gap-1-3\\\" onclick=\\\"showGapOptions(event, '1', '3')\\\">(3)</span>  sustainable solutions have attracted worldwide attention. Vietnam's <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('innovative')\\\">innovative</span> policies present multinational corporations  <span class=\\\"gap-btn\\\" id=\\\"gap-1-4\\\" onclick=\\\"showGapOptions(event, '1', '4')\\\">(4)</span>  game-changing <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('investment')\\\">investment</span> possibilities. Vietnam is  <span class=\\\"gap-btn\\\" id=\\\"gap-1-5\\\" onclick=\\\"showGapOptions(event, '1', '5')\\\">(5)</span>  out all the stops to create a business-friendly environment. We are committed  <span class=\\\"gap-btn\\\" id=\\\"gap-1-6\\\" onclick=\\\"showGapOptions(event, '1', '6')\\\">(6)</span>  our global reach while continuing to strengthen domestic capabilities.<br></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 2: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">Learning in the 5th Dimension<br>        While certain learning methods remain conventional,  <span class=\\\"gap-btn\\\" id=\\\"gap-2-7\\\" onclick=\\\"showGapOptions(event, '2', '7')\\\">(7)</span>  have transcended into quantum-based approaches, with another breakthrough emerging in neural plasticity research. Our <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('innovative')\\\">innovative</span> program  <span class=\\\"gap-btn\\\" id=\\\"gap-2-8\\\" onclick=\\\"showGapOptions(event, '2', '8')\\\">(8)</span>  transform conventional education through multidimensional learning techniques. The paradigm  <span class=\\\"gap-btn\\\" id=\\\"gap-2-9\\\" onclick=\\\"showGapOptions(event, '2', '9')\\\">(9)</span>  in cognitive enhancement demonstrates unprecedented results.  <span class=\\\"gap-btn\\\" id=\\\"gap-2-10\\\" onclick=\\\"showGapOptions(event, '2', '10')\\\">(10)</span>  the latest neuroscientific research, our methodology integrates multiple learning pathways. The synergy between artificial intelligence and human  <span class=\\\"gap-btn\\\" id=\\\"gap-2-11\\\" onclick=\\\"showGapOptions(event, '2', '11')\\\">(11)</span>  creates a groundbreaking learning ecosystem. A  <span class=\\\"gap-btn\\\" id=\\\"gap-2-12\\\" onclick=\\\"showGapOptions(event, '2', '12')\\\">(12)</span>  of evidence supports our revolutionary approach.<br></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 3: Sentence Rearrangement</h3><div style=\\\"margin-bottom:30px\\\"><strong>Question 13.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-13\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Sarah. Hey, did you know my grandmother just started a TikTok channel about knitting?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Sarah. She does these really cool time-lapse videos of her knitting projects. But the funny part is she adds heavy metal music as background!</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> Marcus. No way! What kind of content does she make?</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('13', 'c,a,b')\\\">Check</button><span id=\\\"fb-13\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-13\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: c - a - b</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 14.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-14\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Tom. Hey, I've been meaning to ask—what's with the tiny greenhouse on your desk?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Maya. proudly Yep! It takes about 7 days from seed to harvest. I just snip what I need each day. Saves money and they're super fresh.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> Tom. Wait, you're telling me those tiny plants in there are actually your lunch?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> Maya. Oh, that! It's my new \\\"lunch garden.\\\" I'm growing microgreens for my sandwiches right at my workspace.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Tom. That's actually genius! But doesn't your boss mind having a mini farm on your desk?</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('14', 'd,a,e,c,b')\\\">Check</button><span id=\\\"fb-14\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-14\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: d - a - e - c - b</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 15.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-15\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Another student from Brazil was there too, and we practiced conversing while exploring the tea house garden. Even though we made plenty of mistakes, it felt so natural learning this way.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> The most surreal part? When I took off my VR headset, I realized I'd been \\\"in Japan\\\" for two hours and somehow learned more Japanese than I did in a month of traditional classes. Technology is wild, isn't it? I can't wait to tell you about next week's lesson—we're going to a virtual Tokyo fish market!</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> By the way, how's your AI music theory tutor working out? Still helping you compose those personalized practice pieces?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Instead of just memorizing phrases from a textbook, I actually had to participate in a tea ceremony—in Japanese! My virtual tea master was so patient, correcting my pronunciation while I awkwardly tried to remember the proper way to hold the tea bowl.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> You won't believe what happened in my virtual reality language class today! Remember how I told you I was trying that new VR language learning program? Well, today we had a \\\"virtual field trip\\\" to a traditional Japanese tea house.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('15', 'c,b,d,a,e')\\\">Check</button><span id=\\\"fb-15\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-15\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: c - b - d - a - e</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 16.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-16\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Our mentorship program took an <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('innovative')\\\">innovative</span> turn by matching people based purely on skills and goals. A junior male designer paired with a senior female developer created one of our most successful mentoring relationships, challenging traditional assumptions.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> In our tech startup, we introduced \\\"blind code reviews\\\" where all code submissions are anonymous. This simple change revealed that brilliant solutions came from unexpected team members, proving that talent has no gender.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> Our office culture shifted dramatically. Daily meetings became more inclusive, with junior members speaking up confidently. The old hierarchy faded, replaced by a system where good ideas matter more than who presents them.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> At home, my partner and I stopped labeling chores as \\\"male\\\" or \\\"female\\\" tasks. This shift led to surprising discoveries—they're an amazing cook, while I excel at fixing things. Breaking free from gender roles opened new possibilities for both of us.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> By using AI tools to screen resumes without personal information, our hiring process now focuses purely on talent. The result? A naturally diverse team built on merit, where equality isn't just a goal—it's our daily reality.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('16', 'b,e,a,d,c')\\\">Check</button><span id=\\\"fb-16\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-16\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: b - e - a - d - c</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 17.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-17\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Working with the World Health Organization (WHO) during the pandemic revealed our strength. Vietnam's success in combining high-tech tracking systems with community-based healthcare became a model for other developing nations, earning recognition from global health experts.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Our partnership with the World Trade Organization (WTO) opened unexpected doors. Local coffee farmers in Đắk Lắk now sell directly to European markets through e-commerce platforms, while young tech startups in Hanoi collaborate with Silicon Valley mentors, showing how global integration creates everyday opportunities.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Vietnam's path in ASEAN has evolved remarkably. From a newcomer in 1995 to hosting major summits today, our nation has <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('transformed')\\\">transformed</span> from a quiet member into an active voice in Southeast Asian affairs, particularly in digital economy initiatives.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> The United Nations Development Programme (UNDP) collaboration has taken an <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('innovative')\\\">innovative</span> turn. In the Mekong Delta, traditional farmers now use AI-powered apps to predict flooding and adjust planting schedules. This blend of ancient farming wisdom and modern technology showcases Vietnam's <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('unique')\\\">unique</span> approach to development.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> Our recent leadership in international climate initiatives demonstrates growth. From pioneering green energy projects in Phú Quốc to leading discussions on sustainable development at COP26, Vietnam has evolved from a participant to a contributor in global environmental solutions.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('17', 'd,b,e,c,a')\\\">Check</button><span id=\\\"fb-17\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-17\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: d - b - e - c - a</div></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 4: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">In today's rapidly evolving society,  <span class=\\\"gap-btn\\\" id=\\\"gap-4-18\\\" onclick=\\\"showGapOptions(event, '4', '18')\\\">(18)</span> . The barriers that once divided communities based on gender, race, and social status are gradually being dismantled, though much work remains to be done. Had society recognized the importance of equality earlier, many historical injustices could have been prevented.<br>The digital revolution,  <span class=\\\"gap-btn\\\" id=\\\"gap-4-19\\\" onclick=\\\"showGapOptions(event, '4', '19')\\\">(19)</span> , has become a powerful catalyst for promoting equality and understanding. Breaking down systemic barriers requires not only legislative changes but also a fundamental shift in societal attitudes; furthermore, it demands active participation from individuals and institutions alike.<br> <span class=\\\"gap-btn\\\" id=\\\"gap-4-20\\\" onclick=\\\"showGapOptions(event, '4', '20')\\\">(20)</span>  and opportunities for marginalized groups, while simultaneously educating the public about unconscious biases and privilege. Recognizing the urgency of addressing inequality and  <span class=\\\"gap-btn\\\" id=\\\"gap-4-21\\\" onclick=\\\"showGapOptions(event, '4', '21')\\\">(21)</span> .<br>Countless discriminatory practices  <span class=\\\"gap-btn\\\" id=\\\"gap-4-22\\\" onclick=\\\"showGapOptions(event, '4', '22')\\\">(22)</span> . The path toward true equality may be long and challenging, but each step forward brings us closer to a world where everyone has access to the same opportunities, regardless of their background. As we continue to break chains and build bridges, the promise of a more <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('equitable')\\\">equitable</span> future becomes not just a possibility but an achievable reality. This transformative journey requires unwavering dedication, compassion, and the collective will to challenge and change deeply rooted societal norms. Through education and persistent advocacy, we can create lasting change that transcends generations.<br></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 5: Reading</h3>\\n                        <button class=\\\"fullscreen-btn\\\" onclick=\\\"toggleFullScreenReading(this)\\\">⛶ Full Screen</button>\\n                    </div>\\n                    <div class=\\\"reading-container\\\" id=\\\"reading-5\\\"><div class=\\\"reading-left\\\">Vietnam's <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('emergence')\\\">emergence</span> as a significant player in the global business landscape has been remarkable. Over the past decade, this Southeast Asian nation has <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('transformed')\\\">transformed</span> from a <b>primarily</b> agricultural economy into a <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('dynamic')\\\">dynamic</span> hub for manufacturing and technology. Major corporations like Samsung, Intel, and Apple have established substantial <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('operations')\\\">operations</span> in Vietnam, attracted by its skilled workforce, <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('competitive')\\\">competitive</span> labor costs, and strategic location within the Asia-Pacific region.<br><br>The country's success in attracting foreign <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('investment')\\\">investment</span> stems from <b>its</b> <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('commitment')\\\">commitment</span> to economic <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('reforms')\\\">reforms</span>. Vietnamese authorities have implemented policies to <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('streamline')\\\">streamline</span> business <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('procedures')\\\">procedures</span> and enhance <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('transparency')\\\">transparency</span>. Additionally, significant investments in education have produced a young, tech-<span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('savvy')\\\">savvy</span> workforce capable of meeting global organizations' requirements. This combination of <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('favorable')\\\">favorable</span> policies and human capital development has <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('positioned')\\\">positioned</span> Vietnam as an attractive alternative to traditional manufacturing powerhouses in the region.<br><br>What sets Vietnam apart is its <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('unique')\\\">unique</span> approach to international business integration. Rather than simply serving as a manufacturing base, the country has actively pursued knowledge transfer and technological advancement. Vietnamese companies are increasingly <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('partnering')\\\">partnering</span> with global <b>firms</b> to develop <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('innovative')\\\">innovative</span> solutions and cutting-edge technologies. The government's emphasis on digital transformation has accelerated this trend, making Vietnam an important player in the global digital economy and international trade networks.<br><br>The impact of Vietnam's rise extends beyond economic metrics. <b>The country's growing influence has prompted global organizations to <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('reassess')\\\">reassess</span> their strategies</b>. Many companies now view Vietnam not just as a production hub but as a crucial market for future growth. This shift has led to increased <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('investment')\\\">investment</span> in research facilities and innovation labs across the country. As Vietnam continues to <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('evolve')\\\">evolve</span>, its role in reshaping global business practices becomes more <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('pronounced')\\\">pronounced</span> and influential in the international business community.<br><br></div><div class=\\\"reading-right\\\"><div class=\\\"mcq-question\\\"><b>Question 23.</b> Which of the following is NOT mentioned as a factor contributing to Vietnam's economic growth?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '23', 'A')\\\"> A. Skilled workforce availability</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '23', 'B')\\\"> B. Strategic location in Asia-Pacific</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '23', 'C')\\\"> C. Government policies for business reform</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '23', 'D')\\\"> D. Agricultural modernization programs</label></div><div id=\\\"res-5-23\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 24.</b> The word “primarily” in paragraph 1 is OPPOSTIE in meaning to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '24', 'A')\\\"> A. mainly</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '24', 'B')\\\"> B. chiefly</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '24', 'C')\\\"> C. secondarily</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '24', 'D')\\\"> D. predominantly</label></div><div id=\\\"res-5-24\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 25.</b> The word “its” in p
