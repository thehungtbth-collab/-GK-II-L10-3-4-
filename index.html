-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> Like a symphony orchestra, society performs best when every instrument plays its part, regardless of who holds the bow or strikes the keys.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> The corporate ladder is no longer split into \"his\" and \"hers\" rungs but rather welcomes all climbers with equal grip.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> In a world where chromosomes once dictated destinies, we're finally rewriting the rules of human potential.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> In our children's classrooms, future doctors, engineers, and leaders emerge not from gender-sorted boxes but from dreams unrestricted by biological blueprints.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> The revolution of equality isn't just about breaking glass ceilings – it's about building a house where every room welcomes all, where capability trumps chromosomes, and where \"human\" precedes any gender label.</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('15', 'a,b,e,c,d')\">Check</button><span id=\"fb-15\" style=\"margin-left:10px\"></span><div id=\"ans-15\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: a - b - e - c - d</div></div><div style=\"margin-bottom:30px\"><strong>Question 16.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-16\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> The world has become our classroom—podcasts whisper knowledge during morning commutes, while interactive apps turn daily routines into learning adventures.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> This educational revolution isn't just about new tools; it's about unleashing the natural curiosity that lives in our smartphones, embracing the chaos of information, and transforming every scroll, click, and swipe into an opportunity for growth.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> Gone are the days when learning meant being chained to dusty textbooks and monotonous lectures.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> Social media platforms have evolved into unexpected classrooms, where TikTok tutorials and Instagram infographics make complex topics digestible in bite-sized pieces.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> Today's education dances across virtual realms, where AI tutors adapt to each student's rhythm, and virtual reality transforms abstract concepts into tangible experiences.</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('16', 'a,b,c,d,e')\">Check</button><span id=\"fb-16\" style=\"margin-left:10px\"></span><div id=\"ans-16\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: a - b - c - d - e</div></div><div style=\"margin-bottom:30px\"><strong>Question 17.</strong> Drag/Drop:<ul class=\"sortable-list\" id=\"sortable-17\"><li class=\"sortable-item\" draggable=\"true\" data-sid=\"e\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>e.</b> The world watches as this rising Phoenix nation reshapes international dialogue, proving that the most compelling stories of global influence often begin in the most unexpected chapters.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"b\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>b.</b> This is Vietnam's renaissance on the world stage—where centuries of resilience meet modern diplomatic artistry, crafting a masterpiece of international engagement that even the ancient emperors couldn't have imagined.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"c\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>c.</b> Picture Vietnam as the unexpected choreographer in the grand ballet of international diplomacy—once a reluctant performer, now directing bold new moves on the global stage.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"d\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>d.</b> Like a master weaver at an ancient loom, the country threads its economic silk through ASEAN, APEC, and WTO, creating a tapestry that transforms ancient trade routes into digital superhighways.</li><li class=\"sortable-item\" draggable=\"true\" data-sid=\"a\"><span class=\"drag-handle\" style=\"color:#94a3b8;font-weight:bold;font-size:1.2em\">☰</span> <b>a.</b> In the United Nations' great amphitheater, Vietnam's voice has evolved from a whisper to a resonant force, championing peace in lands far from its bamboo shores, while its diplomatic dragons dance gracefully through corridors of power from Geneva to New York.</li></ul><button class=\"action-btn btn-primary\" onclick=\"checkOrder('17', 'c,d,a,e,b')\">Check</button><span id=\"fb-17\" style=\"margin-left:10px\"></span><div id=\"ans-17\" style=\"display:none;color:#22c55e;margin-top:5px\">Correct: c - d - a - e - b</div></div></div><div class=\"section-box\"><h3 class=\"section-title\">Part 4: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\">The human mind's capacity for learning across multiple dimensions represents one of the most fascinating aspects of cognitive science, which has been extensively studied by researchers worldwide. Not only does our brain process information through various channels simultaneously, but it also creates intricate networks of knowledge that interconnect in unexpected ways.  <span class=\"gap-btn\" id=\"gap-4-18\" onclick=\"showGapOptions(event, '4', '18')\">(18)</span> , we would not have developed the ability to master complex skills and abstract concepts.<br>The learning process,  <span class=\"gap-btn\" id=\"gap-4-19\" onclick=\"showGapOptions(event, '4', '19')\">(19)</span> , enables us to adapt to an ever-changing world while building upon existing knowledge structures.  <span class=\"gap-btn\" id=\"gap-4-20\" onclick=\"showGapOptions(event, '4', '20')\">(20)</span> . The brain's <span class=\"vocab-highlight\" onclick=\"showVocabDef('remarkable')\">remarkable</span> ability to forge new connections while pruning unnecessary ones ensures optimal learning efficiency and knowledge retention.<br> <span class=\"gap-btn\" id=\"gap-4-21\" onclick=\"showGapOptions(event, '4', '21')\">(21)</span> . The researchers who dedicate their lives to studying these phenomena have discovered that the mind operates like a vast multiverse, creating parallel processing streams and interconnected networks of information.<br> <span class=\"gap-btn\" id=\"gap-4-22\" onclick=\"showGapOptions(event, '4', '22')\">(22)</span>  and embracing its multidimensional nature, educators and learners alike can develop more effective strategies for knowledge acquisition and retention. The mind, being both the architect and explorer of its own multiverse, continues to surprise us with its boundless potential for growth and adaptation, inspiring generations to unlock their cognitive potential through dedicated practice and continuous learning.<br></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 5: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-5\"><div class=\"reading-left\">The Hanoi Protocol, <span class=\"vocab-highlight\" onclick=\"showVocabDef('established')\">established</span> in 2024, marks a <span class=\"vocab-highlight\" onclick=\"showVocabDef('groundbreaking')\">groundbreaking</span> shift in how nations approach international cooperation. This innovative framework introduces <span class=\"vocab-highlight\" onclick=\"showVocabDef('comprehensive')\">comprehensive</span> guidelines for collaborative problem-solving among countries, particularly in addressing global challenges like climate change and public health crises. The protocol <span class=\"vocab-highlight\" onclick=\"showVocabDef('emphasizes')\">emphasizes</span> <b>transparency</b>, mutual <span class=\"vocab-highlight\" onclick=\"showVocabDef('accountability')\">accountability</span>, and equitable resource sharing, setting it apart from previous international agreements that often favored developed nations.<br><br>At <b>its</b> core, the protocol <span class=\"vocab-highlight\" onclick=\"showVocabDef('mandates')\">mandates</span> regular multilateral consultations and establishes a robust <span class=\"vocab-highlight\" onclick=\"showVocabDef('dispute')\">dispute</span>-resolution mechanism. Countries must engage in quarterly meetings to assess progress and adjust strategies accordingly. The protocol also requires extensive documentation and regular performance reviews from all participants. The framework introduces a \"capacity-building index\" that <span class=\"vocab-highlight\" onclick=\"showVocabDef('determines')\">determines</span> how resources and technical assistance should be distributed among participating nations, ensuring developing countries receive adequate support while maintaining their autonomy in decision-making processes.<br><br>The implementation phase has shown <span class=\"vocab-highlight\" onclick=\"showVocabDef('remarkable')\">remarkable</span> and promising results, with over 120 countries actively participating in various <span class=\"vocab-highlight\" onclick=\"showVocabDef('initiatives')\">initiatives</span> under the protocol. Notable achievements include the establishment of regional knowledge-sharing hubs and the creation of a <span class=\"vocab-highlight\" onclick=\"showVocabDef('comprehensive')\">comprehensive</span> global emergency response network, significantly enhancing the international community's ability to respond swiftly to emerging challenges. While some nations remain hesitant to fully commit, citing concerns about <b>sovereignty</b> and economic <span class=\"vocab-highlight\" onclick=\"showVocabDef('implications')\">implications</span>, the majority have embraced the protocol's principles.<br><br><b>The protocol's dynamic framework and focus on shared <span class=\"vocab-highlight\" onclick=\"showVocabDef('accountability')\">accountability</span> are proving <span class=\"vocab-highlight\" onclick=\"showVocabDef('invaluable')\">invaluable</span> in our digital era</b>. Its innovative approach has sparked specialized frameworks in AI governance, digital innovation sharing, and cross-border research <span class=\"vocab-highlight\" onclick=\"showVocabDef('initiatives')\">initiatives</span>. As nations increasingly embrace its principles, the protocol continues to evolve, integrating real-world insights and adapting to emerging global challenges. By 2030, industry analysts project it will become the <span class=\"vocab-highlight\" onclick=\"showVocabDef('definitive')\">definitive</span> gold standard for international partnerships, sustainable development, and multi-stakeholder collaborations worldwide.<br><br></div><div class=\"reading-right\"><div class=\"mcq-question\"><b>Question 23.</b> Which of the following is NOT mentioned as a feature of the Hanoi Protocol?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q23\" value=\"A\" onchange=\"checkMCQ('5', '23', 'A')\"> A. Financial penalties for non-compliant nations</label><label><input type=\"radio\" name=\"q23\" value=\"B\" onchange=\"checkMCQ('5', '23', 'B')\"> B. Quarterly multilateral consultations</label><label><input type=\"radio\" name=\"q23\" value=\"C\" onchange=\"checkMCQ('5', '23', 'C')\"> C. A capacity-building index for resource distribution</label><label><input type=\"radio\" name=\"q23\" value=\"D\" onchange=\"checkMCQ('5', '23', 'D')\"> D. Regional knowledge-sharing hubs</label></div><div id=\"res-5-23\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 24.</b> The word “transparency” in paragraph 1 is OPPOSITE in meaning to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q24\" value=\"A\" onchange=\"checkMCQ('5', '24', 'A')\"> A. secrecy</label><label><input type=\"radio\" name=\"q24\" value=\"B\" onchange=\"checkMCQ('5', '24', 'B')\"> B. openness</label><label><input type=\"radio\" name=\"q24\" value=\"C\" onchange=\"checkMCQ('5', '24', 'C')\"> C. clarity</label><label><input type=\"radio\" name=\"q24\" value=\"D\" onchange=\"checkMCQ('5', '24', 'D')\"> D. honesty</label></div><div id=\"res-5-24\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 25.</b> The word “its” in paragraph 2 refers to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q25\" value=\"A\" onchange=\"checkMCQ('5', '25', 'A')\"> A. the framework's</label><label><input type=\"radio\" name=\"q25\" value=\"B\" onchange=\"checkMCQ('5', '25', 'B')\"> B. the protocol's</label><label><input type=\"radio\" name=\"q25\" value=\"C\" onchange=\"checkMCQ('5', '25', 'C')\"> C. the nation's</label><label><input type=\"radio\" name=\"q25\" value=\"D\" onchange=\"checkMCQ('5', '25', 'D')\"> D. the cooperation's</label></div><div id=\"res-5-25\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 26.</b> The word “sovereignty” in paragraph 3 could be best replaced by_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q26\" value=\"A\" onchange=\"checkMCQ('5', '26', 'A')\"> A. democracy</label><label><input type=\"radio\" name=\"q26\" value=\"B\" onchange=\"checkMCQ('5', '26', 'B')\"> B. economy</label><label><input type=\"radio\" name=\"q26\" value=\"C\" onchange=\"checkMCQ('5', '26', 'C')\"> C. leadership</label><label><input type=\"radio\" name=\"q26\" value=\"D\" onchange=\"checkMCQ('5', '26', 'D')\"> D. independence</label></div><div id=\"res-5-26\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 27.</b> Which of the following best paraphrases the underlined sentence in paragraph 4?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q27\" value=\"A\" onchange=\"checkMCQ('5', '27', 'A')\"> A. The modern structure and collective monitoring methods have enhanced global cooperation in the current period.</label><label><input type=\"radio\" name=\"q27\" value=\"B\" onchange=\"checkMCQ('5', '27', 'B')\"> B. The advanced platform and mutual oversight practices have improved international relations in recent decades.</label><label><input type=\"radio\" name=\"q27\" value=\"C\" onchange=\"checkMCQ('5', '27', 'C')\"> C. The flexible system and joint responsibility approach have become essential tools in today's technological world.</label><label><input type=\"radio\" name=\"q27\" value=\"D\" onchange=\"checkMCQ('5', '27', 'D')\"> D. The adaptive program and shared tracking processes have transformed digital partnerships in modern society.</label></div><div id=\"res-5-27\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 28.</b> Which of the following is TRUE according to the passage?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q28\" value=\"A\" onchange=\"checkMCQ('5', '28', 'A')\"> A. The protocol requires nations to participate in quarterly meetings and submit detailed reports on their performance.</label><label><input type=\"radio\" name=\"q28\" value=\"B\" onchange=\"checkMCQ('5', '28', 'B')\"> B. The protocol has been fully accepted by all nations with no concerns about economic impacts or national sovereignty.</label><label><input type=\"radio\" name=\"q28\" value=\"C\" onchange=\"checkMCQ('5', '28', 'C')\"> C. The protocol was designed to give developed nations more advantages in international resource-sharing programs.</label><label><input type=\"radio\" name=\"q28\" value=\"D\" onchange=\"checkMCQ('5', '28', 'D')\"> D. The protocol will cease its evolution by 2030 when it becomes the standard for international collaborations.</label></div><div id=\"res-5-28\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 29.</b> In which paragraph does the writer mention the creation of a comprehensive global emergency response network?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q29\" value=\"A\" onchange=\"checkMCQ('5', '29', 'A')\"> A. Paragraph 2</label><label><input type=\"radio\" name=\"q29\" value=\"B\" onchange=\"checkMCQ('5', '29', 'B')\"> B. Paragraph 3</label><label><input type=\"radio\" name=\"q29\" value=\"C\" onchange=\"checkMCQ('5', '29', 'C')\"> C. Paragraph 4</label><label><input type=\"radio\" name=\"q29\" value=\"D\" onchange=\"checkMCQ('5', '29', 'D')\"> D. Paragraph 1</label></div><div id=\"res-5-29\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 30.</b> In which paragraph does the writer mention what the protocol requires countries to do in terms of meetings?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q30\" value=\"A\" onchange=\"checkMCQ('5', '30', 'A')\"> A. Paragraph 3</label><label><input type=\"radio\" name=\"q30\" value=\"B\" onchange=\"checkMCQ('5', '30', 'B')\"> B. Paragraph 1</label><label><input type=\"radio\" name=\"q30\" value=\"C\" onchange=\"checkMCQ('5', '30', 'C')\"> C. Paragraph 4</label><label><input type=\"radio\" name=\"q30\" value=\"D\" onchange=\"checkMCQ('5', '30', 'D')\"> D. Paragraph 2</label></div><div id=\"res-5-30\" style=\"margin-top:5px\"></div></div></div></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 6: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-6\"><div class=\"reading-left\"><b>[I]</b> In recent decades, society has turned over a new leaf in how we understand and express gender, shaking things up in <span class=\"vocab-highlight\" onclick=\"showVocabDef('unprecedented')\">unprecedented</span> ways. <b>[II]</b> Traditional binary concepts of male and female are being challenged as people increasingly recognize gender as a <span class=\"vocab-highlight\" onclick=\"showVocabDef('spectrum')\">spectrum</span> rather than a rigid dichotomy. <b>[III]</b> This shift has profound <span class=\"vocab-highlight\" onclick=\"showVocabDef('implications')\">implications</span> for how we organize our social institutions, from education and healthcare to workplace policies and legal frameworks. <b>[IV]</b><br><br>The movement beyond gender norms has gained momentum through increased visibility of non-binary and <span class=\"vocab-highlight\" onclick=\"showVocabDef('transgender')\">transgender</span> individuals in media and public life. Social media platforms have become powerful tools for sharing personal stories and building communities, while celebrities and public figures who challenge traditional gender expressions have helped <span class=\"vocab-highlight\" onclick=\"showVocabDef('normalize')\">normalize</span> diverse gender identities. These changes have encouraged younger generations to explore and express <b>their</b> authentic selves without feeling confined by conventional gender roles. Moreover, grassroots movements and <span class=\"vocab-highlight\" onclick=\"showVocabDef('advocacy')\">advocacy</span> groups have played a crucial role in raising awareness and promoting <span class=\"vocab-highlight\" onclick=\"showVocabDef('acceptance')\">acceptance</span> of gender diversity in communities worldwide.<br><br>Scientific research has also contributed to our <span class=\"vocab-highlight\" onclick=\"showVocabDef('evolving')\">evolving</span> understanding of gender identity. Studies in neuroscience and psychology have demonstrated that gender expression is influenced by complex interactions between biological, social, and cultural factors. This research challenges <b>simplistic</b> biological <span class=\"vocab-highlight\" onclick=\"showVocabDef('determinism')\">determinism</span> and supports the view that gender identity exists on a continuum. Healthcare providers are increasingly adopting gender-affirming approaches, recognizing that supporting individuals in their gender expression leads to better mental health outcomes and overall well-being in both personal and professional spheres.<br><br>The <span class=\"vocab-highlight\" onclick=\"showVocabDef('dismantling')\">dismantling</span> of gender norms has far-reaching <span class=\"vocab-highlight\" onclick=\"showVocabDef('implications')\">implications</span> for society. <b>Workplaces are implementing more inclusive policies, schools are adapting their <span class=\"vocab-highlight\" onclick=\"showVocabDef('curricula')\">curricula</span> and facilities, and governments are revising <span class=\"vocab-highlight\" onclick=\"showVocabDef('legislation')\">legislation</span> to protect gender-diverse individuals</b>. Despite ongoing resistance from some quarters, the trend toward greater gender inclusivity appears irreversible. As society continues to evolve, we move closer to a future where individuals can freely express their gender identity without fear of <span class=\"vocab-highlight\" onclick=\"showVocabDef('discrimination')\">discrimination</span> or <span class=\"vocab-highlight\" onclick=\"showVocabDef('prejudice')\">prejudice</span>.<br><br></div><div class=\"reading-right\"><div class=\"mcq-question\"><b>Question 31.</b> The phrase “shaking things up” in paragraph 1 could be best replaced by_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q31\" value=\"A\" onchange=\"checkMCQ('6', '31', 'A')\"> A. breaking down</label><label><input type=\"radio\" name=\"q31\" value=\"B\" onchange=\"checkMCQ('6', '31', 'B')\"> B. stirring up</label><label><input type=\"radio\" name=\"q31\" value=\"C\" onchange=\"checkMCQ('6', '31', 'C')\"> C. turning around</label><label><input type=\"radio\" name=\"q31\" value=\"D\" onchange=\"checkMCQ('6', '31', 'D')\"> D. bringing about</label></div><div id=\"res-6-31\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 32.</b> Where in paragraph 1 does the following sentence best fit?\nThe impact of this evolution extends beyond individual expression to reshape fundamental aspects of human interaction and social development in modern society.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q32\" value=\"A\" onchange=\"checkMCQ('6', '32', 'A')\"> A. [I]</label><label><input type=\"radio\" name=\"q32\" value=\"B\" onchange=\"checkMCQ('6', '32', 'B')\"> B. [II]</label><label><input type=\"radio\" name=\"q32\" value=\"C\" onchange=\"checkMCQ('6', '32', 'C')\"> C. [III]</label><label><input type=\"radio\" name=\"q32\" value=\"D\" onchange=\"checkMCQ('6', '32', 'D')\"> D. [IV]</label></div><div id=\"res-6-32\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 33.</b> Which of the following is NOT mentioned as a factor influencing gender identity?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q33\" value=\"A\" onchange=\"checkMCQ('6', '33', 'A')\"> A. genetic inheritance</label><label><input type=\"radio\" name=\"q33\" value=\"B\" onchange=\"checkMCQ('6', '33', 'B')\"> B. biological factors</label><label><input type=\"radio\" name=\"q33\" value=\"C\" onchange=\"checkMCQ('6', '33', 'C')\"> C. social factors</label><label><input type=\"radio\" name=\"q33\" value=\"D\" onchange=\"checkMCQ('6', '33', 'D')\"> D. cultural factors</label></div><div id=\"res-6-33\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 34.</b> The word “their” in paragraph 2 refers to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q34\" value=\"A\" onchange=\"checkMCQ('6', '34', 'A')\"> A. social media platforms</label><label><input type=\"radio\" name=\"q34\" value=\"B\" onchange=\"checkMCQ('6', '34', 'B')\"> B. celebrities and public figures</label><label><input type=\"radio\" name=\"q34\" value=\"C\" onchange=\"checkMCQ('6', '34', 'C')\"> C. younger generations</label><label><input type=\"radio\" name=\"q34\" value=\"D\" onchange=\"checkMCQ('6', '34', 'D')\"> D. conventional gender roles</label></div><div id=\"res-6-34\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 35.</b> Which of the following best summarises the paragraph 2?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q35\" value=\"A\" onchange=\"checkMCQ('6', '35', 'A')\"> A. Digital media and grassroots activism have reshaped gender understanding, while younger generations embrace authentic self-expression freely.</label><label><input type=\"radio\" name=\"q35\" value=\"B\" onchange=\"checkMCQ('6', '35', 'B')\"> B. Media representation and social platforms have transformed public perception of gender identity, while advocacy groups promote community acceptance.</label><label><input type=\"radio\" name=\"q35\" value=\"C\" onchange=\"checkMCQ('6', '35', 'C')\"> C. Social movements and celebrity influence have changed gender expression norms, while digital platforms enhance personal story sharing globally.</label><label><input type=\"radio\" name=\"q35\" value=\"D\" onchange=\"checkMCQ('6', '35', 'D')\"> D. Public figures and community organizations have challenged gender traditions, while social networks facilitate identity-based connections widely.</label></div><div id=\"res-6-35\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 36.</b> The word “simplistic” in paragraph 3 is OPPOSITE in meaning to_________.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q36\" value=\"A\" onchange=\"checkMCQ('6', '36', 'A')\"> A. basic</label><label><input type=\"radio\" name=\"q36\" value=\"B\" onchange=\"checkMCQ('6', '36', 'B')\"> B. complex</label><label><input type=\"radio\" name=\"q36\" value=\"C\" onchange=\"checkMCQ('6', '36', 'C')\"> C. elementary</label><label><input type=\"radio\" name=\"q36\" value=\"D\" onchange=\"checkMCQ('6', '36', 'D')\"> D. superficial</label></div><div id=\"res-6-36\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 37.</b> Which of the following is TRUE according to the passage?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q37\" value=\"A\" onchange=\"checkMCQ('6', '37', 'A')\"> A. Scientific research proves that gender identity is determined solely by biological factors in human development.</label><label><input type=\"radio\" name=\"q37\" value=\"B\" onchange=\"checkMCQ('6', '37', 'B')\"> B. Healthcare providers worldwide have fully implemented gender-affirming approaches in all medical facilities.</label><label><input type=\"radio\" name=\"q37\" value=\"C\" onchange=\"checkMCQ('6', '37', 'C')\"> C. The movement towards gender inclusivity has received universal acceptance without any social resistance.</label><label><input type=\"radio\" name=\"q37\" value=\"D\" onchange=\"checkMCQ('6', '37', 'D')\"> D. Social media and public figures have played a key role in normalizing diverse gender identities in society.</label></div><div id=\"res-6-37\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 38.</b> Which of the following best paraphrases the underlined sentence in paragraph 4?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q38\" value=\"A\" onchange=\"checkMCQ('6', '38', 'A')\"> A. Various institutions are modifying their operational frameworks to ensure equal treatment of all gender identities.</label><label><input type=\"radio\" name=\"q38\" value=\"B\" onchange=\"checkMCQ('6', '38', 'B')\"> B. Educational systems and corporate entities are leading social changes while governments observe the transition.</label><label><input type=\"radio\" name=\"q38\" value=\"C\" onchange=\"checkMCQ('6', '38', 'C')\"> C. Public and private sectors are gradually responding to demands for changes in traditional gender-based policies.</label><label><input type=\"radio\" name=\"q38\" value=\"D\" onchange=\"checkMCQ('6', '38', 'D')\"> D. Social organizations are independently developing strategies to address gender diversity in their environments.</label></div><div id=\"res-6-38\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 39.</b> Which of the following can be inferred from the passage?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q39\" value=\"A\" onchange=\"checkMCQ('6', '39', 'A')\"> A. The transformation of gender understanding will eventually eliminate all forms of gender-based discrimination.</label><label><input type=\"radio\" name=\"q39\" value=\"B\" onchange=\"checkMCQ('6', '39', 'B')\"> B. Future generations will completely abandon traditional gender roles in favor of a purely spectrum-based approach.</label><label><input type=\"radio\" name=\"q39\" value=\"C\" onchange=\"checkMCQ('6', '39', 'C')\"> C. The shift toward gender inclusivity will continue despite some opposition from traditional social institutions.</label><label><input type=\"radio\" name=\"q39\" value=\"D\" onchange=\"checkMCQ('6', '39', 'D')\"> D. Scientific research will ultimately prove that biological factors are the primary determinants of gender identity.</label></div><div id=\"res-6-39\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 40.</b> Which of the following best summarises the passage?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q40\" value=\"A\" onchange=\"checkMCQ('6', '40', 'A')\"> A. Scientific research and healthcare providers are leading revolutionary changes in understanding gender identity.</label><label><input type=\"radio\" name=\"q40\" value=\"B\" onchange=\"checkMCQ('6', '40', 'B')\"> B. Society's evolving view of gender as a spectrum is reshaping institutions and advancing toward an inclusive future.</label><label><input type=\"radio\" name=\"q40\" value=\"C\" onchange=\"checkMCQ('6', '40', 'C')\"> C. Social media and celebrity influence have transformed traditional perspectives on gender expression globally.</label><label><input type=\"radio\" name=\"q40\" value=\"D\" onchange=\"checkMCQ('6', '40', 'D')\"> D. Modern technology and grassroots movements are challenging historical binary concepts of gender expression.</label></div><div id=\"res-6-40\" style=\"margin-top:5px\"></div></div></div></div></div>\n        </div>\n        <div id=\"gap-popover\" class=\"popover\"></div><div class=\"overlay\" onclick=\"closeVocabModal()\"></div>\n        <div class=\"vocab-modal\" id=\"vocab-modal\"><div class=\"vocab-header\" id=\"v-word\"></div><div class=\"vocab-body\"><div style=\"font-weight:bold;margin-bottom:10px\" id=\"v-mean s occurring across infinite dimensions of thought and experience\",\"D\":\"that it occurs across infinite dimensions of thought and experience\"},\"4-20\":{\"A\":\"Experiences reshape our neural pathways to enable mental adaptability\",\"B\":\"Neural pathways reshape our experiences to enable mental adaptability\",\"C\":\"Mental adaptability reshapes our neural pathways to enable experiences\",\"D\":\"Neural adaptability reshapes our experiences to enable mental pathways\"},\"4-21\":{\"A\":\"Multidimensional learning and cognitive psychology help us understand how neuroscience works in the mind\",\"B\":\"The mind and cognitive psychology help us understand how neuroscience works in multidimensional learning\",\"C\":\"Neuroscience and cognitive psychology help us understand how the mind works in multidimensional learning\",\"D\":\"Cognitive psychology and the mind help us understand how neuroscience works in multidimensional learning\"},\"4-22\":{\"A\":\"Being recognized the complexity of human cognition\",\"B\":\"Having recognize the complexity of human cognition\",\"C\":\"Recognizing the complexity of human cognition\",\"D\":\"That recognizes the complexity of human cognition\"}},\"vocabMap\":{\"established\":{\"original\":\"established\",\"meaning\":\"được thành lập, ổn định\",\"synonyms\":\"founded, recognized\",\"example\":\"The school was established in 1900. (Ngôi trường được thành lập năm 1900.)\"},\"groundbreaking\":{\"original\":\"groundbreaking\",\"meaning\":\"đột phá, tiên phong\",\"synonyms\":\"innovative, pioneering\",\"example\":\"The scientist made a groundbreaking discovery. (Nhà khoa học có phát hiện đột phá.)\"},\"comprehensive\":{\"original\":\"comprehensive\",\"meaning\":\"toàn diện\",\"synonyms\":\"complete, thorough\",\"example\":\"The report provides a comprehensive analysis. (Báo cáo đưa ra phân tích toàn diện.)\"},\"emphasizes\":{\"original\":\"emphasizes\",\"meaning\":\"nhấn mạnh\",\"synonyms\":\"highlights, stresses\",\"example\":\"The teacher emphasizes discipline. (Giáo viên nhấn mạnh kỷ luật.)\"},\"accountability\":{\"original\":\"accountability\",\"meaning\":\"trách nhiệm giải trình\",\"synonyms\":\"responsibility, liability\",\"example\":\"Leaders must show accountability. (Các nhà lãnh đạo phải thể hiện trách nhiệm giải trình.)\"},\"mandates\":{\"original\":\"mandates\",\"meaning\":\"quy định, bắt buộc\",\"synonyms\":\"orders, requirements\",\"example\":\"The law mandates safety checks. (Luật pháp bắt buộc kiểm tra an toàn.)\"},\"dispute\":{\"original\":\"dispute\",\"meaning\":\"tranh chấp\",\"synonyms\":\"conflict, disagreement\",\"example\":\"The workers had a dispute with management. (Công nhân có tranh chấp với ban quản lý.)\"},\"determines\":{\"original\":\"determines\",\"meaning\":\"quyết định, xác định\",\"synonyms\":\"decides, defines\",\"example\":\"The judge determines the sentence. (Thẩm phán quyết định bản án.)\"},\"remarkable\":{\"original\":\"remarkable\",\"meaning\":\"đáng chú ý, xuất sắc\",\"synonyms\":\"extraordinary, notable\",\"example\":\"She made remarkable progress. (Cô ấy đạt được tiến bộ đáng chú ý.)\"},\"initiatives\":{\"original\":\"initiatives\",\"meaning\":\"sáng kiến\",\"synonyms\":\"projects, proposals\",\"example\":\"The government launched new initiatives. (Chính phủ khởi động các sáng kiến mới.)\"},\"invaluable\":{\"original\":\"invaluable\",\"meaning\":\"vô giá, rất hữu ích\",\"synonyms\":\"priceless, extremely useful\",\"example\":\"Her advice was invaluable. (Lời khuyên của cô ấy vô giá.)\"},\"definitive\":{\"original\":\"definitive\",\"meaning\":\"dứt khoát, cuối cùng\",\"synonyms\":\"conclusive, final\",\"example\":\"This is the definitive version of the book. (Đây là phiên bản cuối cùng của cuốn sách.)\"},\"unprecedented\":{\"original\":\"unprecedented\",\"meaning\":\"chưa từng có\",\"synonyms\":\"extraordinary, unmatched\",\"example\":\"The event was unprecedented in history. (Sự kiện chưa từng có trong lịch sử.)\"},\"spectrum\":{\"original\":\"spectrum\",\"meaning\":\"phổ, phạm vi\",\"synonyms\":\"range, scope\",\"example\":\"The disease affects a wide spectrum of people. (Căn bệnh ảnh hưởng đến nhiều nhóm người.)\"},\"implications\":{\"original\":\"implications\",\"meaning\":\"hệ quả, tác động\",\"synonyms\":\"consequences, effects\",\"example\":\"The policy has serious implications. (Chính sách có hệ quả nghiêm trọng.)\"},\"transgender\":{\"original\":\"transgender\",\"meaning\":\"người chuyển giới\",\"synonyms\":\"gender identity term\",\"example\":\"The law protects transgender rights. (Luật pháp bảo vệ quyền của người chuyển giới.)\"},\"normalize\":{\"original\":\"normalize\",\"meaning\":\"bình thường hóa\",\"synonyms\":\"standardize, regularize\",\"example\":\"The treaty helped normalize relations. (Hiệp ước giúp bình thường hóa quan hệ.)\"},\"advocacy\":{\"original\":\"advocacy\",\"meaning\":\"sự vận động, ủng hộ\",\"synonyms\":\"support, promotion\",\"example\":\"She works in advocacy for human rights. (Cô ấy làm việc trong lĩnh vực vận động nhân quyền.)\"},\"acceptance\":{\"original\":\"acceptance\",\"meaning\":\"sự chấp nhận\",\"synonyms\":\"approval, agreement\",\"example\":\"He gained acceptance into the group. (Anh ấy được chấp nhận vào nhóm.)\"},\"evolving\":{\"original\":\"evolving\",\"meaning\":\"đang phát triển, tiến hóa\",\"synonyms\":\"developing, changing\",\"example\":\"Technology is constantly evolving. (Công nghệ luôn phát triển.)\"},\"determinism\":{\"original\":\"determinism\",\"meaning\":\"thuyết định mệnh\",\"synonyms\":\"philosophical doctrine\",\"example\":\"Determinism suggests all events are predetermined. (Thuyết định mệnh cho rằng mọi sự kiện đều được định sẵn.)\"},\"dismantling\":{\"original\":\"dismantling\",\"meaning\":\"tháo dỡ, phá bỏ\",\"synonyms\":\"taking apart, disassembling\",\"example\":\"Workers are dismantling the old building. (Công nhân đang tháo dỡ tòa nhà cũ.)\"},\"curricula\":{\"original\":\"curricula\",\"meaning\":\"chương trình học\",\"synonyms\":\"courses, syllabi\",\"example\":\"Schools updated their curricula. (Các trường cập nhật chương trình học.)\"},\"legislation\":{\"original\":\"legislation\",\"meaning\":\"luật pháp, pháp luật\",\"synonyms\":\"laws, statutes\",\"example\":\"New legislation was passed last year. (Luật mới được thông qua năm ngoái.)\"},\"discrimination\":{\"original\":\"discrimination\",\"meaning\":\"sự phân biệt đối xử\",\"synonyms\":\"bias, unfair treatment\",\"example\":\"The law prohibits discrimination. (Luật pháp cấm phân biệt đối xử.)\"},\"prejudice\":{\"original\":\"prejudice\",\"meaning\":\"định kiến, thành kiến\",\"synonyms\":\"bias, intolerance\",\"example\":\"He faced prejudice because of his background. (Anh ấy đối mặt với định kiến vì xuất thân của mình.)\"}},\"htmlContent\":\"<div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 1: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">Where TikTok Meets Harvard<br>•\\tThe revolutionary approach transforms traditional education into engaging  <span class=\\\"gap-btn\\\" id=\\\"gap-1-1\\\" onclick=\\\"showGapOptions(event, '1', '1')\\\">(1)</span>  experiences. The platform features innovative  <span class=\\\"gap-btn\\\" id=\\\"gap-1-2\\\" onclick=\\\"showGapOptions(event, '1', '2')\\\">(2)</span> . Students  <span class=\\\"gap-btn\\\" id=\\\"gap-1-3\\\" onclick=\\\"showGapOptions(event, '1', '3')\\\">(3)</span>  our courses achieve <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('remarkable')\\\">remarkable</span> results within weeks. Our quantum-powered system transmits micro-learning modules  <span class=\\\"gap-btn\\\" id=\\\"gap-1-4\\\" onclick=\\\"showGapOptions(event, '1', '4')\\\">(4)</span>  participants through interconnected knowledge networks. While traditional education is still  <span class=\\\"gap-btn\\\" id=\\\"gap-1-5\\\" onclick=\\\"showGapOptions(event, '1', '5')\\\">(5)</span>  its feet, we're blazing a trail in the quantum learning revolution. Excelling at advanced concepts requires
