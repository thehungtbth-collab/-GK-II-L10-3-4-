"The future of artificial intelligence holds promising possibilities for automation and digital transformation\"}},\"vocabMap\":{\"instantly\":{\"original\":\"instantly\",\"meaning\":\"ngay lập tức\",\"synonyms\":\"immediately, at once\",\"example\":\"She replied instantly to the message. (Cô ấy trả lời tin nhắn ngay lập tức.)\"},\"sorcery\":{\"original\":\"sorcery\",\"meaning\":\"ma thuật, phù phép\",\"synonyms\":\"magic, witchcraft\",\"example\":\"The tale is full of sorcery. (Câu chuyện đầy ma thuật.)\"},\"revolutionized\":{\"original\":\"revolutionized\",\"meaning\":\"cách mạng hóa, thay đổi triệt để\",\"synonyms\":\"transformed, changed\",\"example\":\"Smartphones have revolutionized communication. (Điện thoại thông minh đã cách mạng hóa giao tiếp.)\"},\"unprecedented\":{\"original\":\"unprecedented\",\"meaning\":\"chưa từng có\",\"synonyms\":\"extraordinary, unmatched\",\"example\":\"The event was unprecedented in history. (Sự kiện chưa từng có trong lịch sử.)\"},\"acquisition\":{\"original\":\"acquisition\",\"meaning\":\"sự giành được, thu nhận\",\"synonyms\":\"obtaining, purchase\",\"example\":\"The company completed the acquisition of a startup. (Công ty hoàn tất việc mua lại một startup.)\"},\"concerning\":{\"original\":\"concerning\",\"meaning\":\"liên quan đến, đáng lo ngại\",\"synonyms\":\"regarding, worrying\",\"example\":\"He asked questions concerning the project. (Anh ấy hỏi những câu liên quan đến dự án.)\"},\"diminish\":{\"original\":\"diminish\",\"meaning\":\"làm giảm, suy yếu\",\"synonyms\":\"reduce, lessen\",\"example\":\"His influence began to diminish. (Ảnh hưởng của anh ấy bắt đầu suy giảm.)\"},\"analysis\":{\"original\":\"analysis\",\"meaning\":\"sự phân tích\",\"synonyms\":\"examination, study\",\"example\":\"The report includes detailed analysis. (Báo cáo có phân tích chi tiết.)\"},\"retention\":{\"original\":\"retention\",\"meaning\":\"sự duy trì, giữ lại\",\"synonyms\":\"preservation, memory\",\"example\":\"Good teaching improves knowledge retention. (Giảng dạy tốt giúp duy trì kiến thức.)\"},\"accelerate\":{\"original\":\"accelerate\",\"meaning\":\"tăng tốc\",\"synonyms\":\"speed up, hasten\",\"example\":\"Technology can accelerate progress. (Công nghệ có thể tăng tốc tiến bộ.)\"},\"personalized\":{\"original\":\"personalized\",\"meaning\":\"cá nhân hóa\",\"synonyms\":\"customized, tailored\",\"example\":\"The app offers personalized recommendations. (Ứng dụng đưa ra gợi ý cá nhân hóa.)\"},\"adjust\":{\"original\":\"adjust\",\"meaning\":\"điều chỉnh\",\"synonyms\":\"modify, adapt\",\"example\":\"He quickly adjusted to the new role. (Anh ấy nhanh chóng điều chỉnh với vai trò mới.)\"},\"master\":{\"original\":\"master\",\"meaning\":\"làm chủ, thành thạo\",\"synonyms\":\"expert, control\",\"example\":\"She mastered the piano at a young age. (Cô ấy thành thạo piano từ khi còn nhỏ.)\"},\"discipline\":{\"original\":\"discipline\",\"meaning\":\"kỷ luật, ngành học\",\"synonyms\":\"order, subject\",\"example\":\"Success requires discipline. (Thành công đòi hỏi kỷ luật.)\"},\"evaluating\":{\"original\":\"evaluating\",\"meaning\":\"đánh giá\",\"synonyms\":\"assessing, judging\",\"example\":\"The teacher is evaluating the students’ work. (Giáo viên đang đánh giá bài làm của học sinh.)\"},\"reliability\":{\"original\":\"reliability\",\"meaning\":\"độ tin cậy\",\"synonyms\":\"dependability, trustworthiness\",\"example\":\"The data shows high reliability. (Dữ liệu cho thấy độ tin cậy cao.)\"},\"comprehensive\":{\"original\":\"comprehensive\",\"meaning\":\"toàn diện\",\"synonyms\":\"complete, thorough\",\"example\":\"The book provides a comprehensive overview. (Cuốn sách cung cấp cái nhìn toàn diện.)\"},\"powerhouse\":{\"original\":\"powerhouse\",\"meaning\":\"cường quốc, nguồn sức mạnh\",\"synonyms\":\"strong force, leader\",\"example\":\"The company is a powerhouse in technology. (Công ty là cường quốc trong công nghệ.)\"},\"dismantling\":{\"original\":\"dismantling\",\"meaning\":\"tháo dỡ, phá bỏ\",\"synonyms\":\"taking apart, disassembling\",\"example\":\"Workers are dismantling the old building. (Công nhân đang tháo dỡ tòa nhà cũ.)\"},\"pivotal\":{\"original\":\"pivotal\",\"meaning\":\"then chốt, quan trọng\",\"synonyms\":\"crucial, central\",\"example\":\"Education plays a pivotal role in society. (Giáo dục đóng vai trò then chốt trong xã hội.)\"},\"normalization\":{\"original\":\"normalization\",\"meaning\":\"sự bình thường hóa\",\"synonyms\":\"standardization, regularization\",\"example\":\"The treaty led to normalization of relations. (Hiệp ước dẫn đến bình thường hóa quan hệ.)\"},\"subsequent\":{\"original\":\"subsequent\",\"meaning\":\"tiếp theo, sau đó\",\"synonyms\":\"following, later\",\"example\":\"The subsequent events confirmed the theory. (Những sự kiện sau đó xác nhận lý thuyết.)\"},\"commitment\":{\"original\":\"commitment\",\"meaning\":\"cam kết\",\"synonyms\":\"dedication, promise\",\"example\":\"He showed strong commitment to the project. (Anh ấy thể hiện cam kết mạnh mẽ với dự án.)\"},\"resilience\":{\"original\":\"resilience\",\"meaning\":\"khả năng phục hồi\",\"synonyms\":\"strength, toughness\",\"example\":\"She showed great resilience after the setback. (Cô ấy thể hiện khả năng phục hồi sau thất bại.)\"},\"testament\":{\"original\":\"testament\",\"meaning\":\"bằng chứng, minh chứng\",\"synonyms\":\"proof, evidence\",\"example\":\"His success is a testament to hard work. (Thành công của anh ấy là minh chứng cho sự chăm chỉ.)\"},\"embrace\":{\"original\":\"embrace\",\"meaning\":\"đón nhận, ôm lấy\",\"synonyms\":\"accept, adopt\",\"example\":\"She decided to embrace new challenges. (Cô ấy quyết định đón nhận thử thách mới.)\"},\"forefront\":{\"original\":\"forefront\",\"meaning\":\"vị trí hàng đầu\",\"synonyms\":\"leading position\",\"example\":\"The company is at the forefront of innovation. (Công ty ở vị trí hàng đầu về đổi mới.)\"},\"visionary\":{\"original\":\"visionary\",\"meaning\":\"có tầm nhìn xa\",\"synonyms\":\"innovative, forward-thinking\",\"example\":\"He is a visionary leader. (Anh ấy là một nhà lãnh đạo có tầm nhìn xa.)\"},\"unwavering\":{\"original\":\"unwavering\",\"meaning\":\"kiên định, không lay chuyển\",\"synonyms\":\"steady, firm\",\"example\":\"She showed unwavering support for her team. (Cô ấy thể hiện sự ủng hộ kiên định cho đội.)\"},\"fertile\":{\"original\":\"fertile\",\"meaning\":\"màu mỡ, phì nhiêu\",\"synonyms\":\"productive, rich\",\"example\":\"The land is very fertile for farming. (Đất rất màu mỡ cho việc canh tác.)\"}},\"htmlContent\":\"<div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 1: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">Where Learning Feels Like Your Favorite Playlist<br>•\\tTransforming  <span class=\\\"gap-btn\\\" id=\\\"gap-1-1\\\" onclick=\\\"showGapOptions(event, '1', '1')\\\">(1)</span>  education into an engaging experience, our innovative learning platform makes knowledge <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acquisition')\\\">acquisition</span> as natural as breathing. Our advanced digital curriculum delivers  <span class=\\\"gap-btn\\\" id=\\\"gap-1-2\\\" onclick=\\\"showGapOptions(event, '1', '2')\\\">(2)</span>  that revolutionize how you absorb information. The students  <span class=\\\"gap-btn\\\" id=\\\"gap-1-3\\\" onclick=\\\"showGapOptions(event, '1', '3')\\\">(3)</span>  in Mind Gym, achieving remarkable results, have inspired countless others. Our mentors explain complex concepts  <span class=\\\"gap-btn\\\" id=\\\"gap-1-4\\\" onclick=\\\"showGapOptions(event, '1', '4')\\\">(4)</span>  students through interactive sessions. Mind Gym is absolutely  <span class=\\\"gap-btn\\\" id=\\\"gap-1-5\\\" onclick=\\\"showGapOptions(event, '1', '5')\\\">(5)</span>  it in the world of modern education. We encourage practicing daily exercises while  <span class=\\\"gap-btn\\\" id=\\\"gap-1-6\\\" onclick=\\\"showGapOptions(event, '1', '6')\\\">(6)</span>  a balanced study schedule.<br></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 2: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">Rewriting Society's Source Code<br>•\\tIn a world where some <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('embrace')\\\">embrace</span> diversity while  <span class=\\\"gap-btn\\\" id=\\\"gap-2-7\\\" onclick=\\\"showGapOptions(event, '2', '7')\\\">(7)</span>  resist change, we must stand united for equality. Society needs to  <span class=\\\"gap-btn\\\" id=\\\"gap-2-8\\\" onclick=\\\"showGapOptions(event, '2', '8')\\\">(8)</span>  the barriers that hold back marginalized communities. The paradigm shift in social  <span class=\\\"gap-btn\\\" id=\\\"gap-2-9\\\" onclick=\\\"showGapOptions(event, '2', '9')\\\">(9)</span>  demands immediate attention.  <span class=\\\"gap-btn\\\" id=\\\"gap-2-10\\\" onclick=\\\"showGapOptions(event, '2', '10')\\\">(10)</span>  the challenges we face, progress continues through collective action. The  <span class=\\\"gap-btn\\\" id=\\\"gap-2-11\\\" onclick=\\\"showGapOptions(event, '2', '11')\\\">(11)</span>  of equality movements shapes our future generations. A  <span class=\\\"gap-btn\\\" id=\\\"gap-2-12\\\" onclick=\\\"showGapOptions(event, '2', '12')\\\">(12)</span>  of voices speaking as one can create lasting change.<br></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 3: Sentence Rearrangement</h3><div style=\\\"margin-bottom:30px\\\"><strong>Question 13.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-13\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Sarah. Oh no, not again! My weather app says it's sunny, but my horoscope app says it'll rain today.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Sarah. Your grandmother's... knee?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> Marcus. Well, my grandmother's knee says it's going to snow, and she's been right 60% of the time!</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('13', 'c,a,b')\\\">Check</button><span id=\\\"fb-13\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-13\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: c - a - b</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 14.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-14\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> Mr. Johnson. Yes, hi. I accidentally left my coffee in the year 1920, and now according to my history book, it apparently inspired the first coffee chain in Chicago!</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Agent Zhang. Welcome to Temporal Transit! How may I help you today?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Mr. Johnson. Can we just go back and remove it?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Agent Zhang. I'm afraid not, sir. Your coffee has become a fixed point in time. We're actually all drinking \\\"Johnson's Original Blend\\\" these days.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('14', 'd,a,c,b')\\\">Check</button><span id=\\\"fb-14\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-14\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: d - a - c - b</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 15.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-15\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> Remember how our teachers used to separate us during sports? Girls for dance, boys for football?</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Now my daughter's the football team captain, and my son just won his first ballet competition. Their trophies sit side by side, and neither looks out of place.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Sometimes the biggest changes start with the smallest steps. Or, in this case, with a purple toolbox and a sewing needle.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> See you at the parent-teacher meeting</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Yesterday, I saw something that would've been unthinkable when we were kids—my son and daughter arguing over who gets to use Mom's toolbox first, while their father was busy teaching them both how to sew. No \\\"boy things\\\" or \\\"girl things\\\"—just\\\" kids being kids.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('15', 'c,a,d,b,e')\\\">Check</button><span id=\\\"fb-15\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-15\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: c - a - d - b - e</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 16.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-16\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> Music class doubles as coding lessons. Kids create digital beats while learning basic programming. They turn math into melodies, making computer science fun.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> \\\"Failure Friday\\\" celebrates learning from mistakes. Students try tough projects and document what went wrong. Yesterday's challenge? Paper airplane physics.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Virtual reality transforms language learning. Students cook with peers from Spain in a digital kitchen, learning Spanish through real conversations and shared recipes.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> My niece learns math in her school garden. She practices fractions by dividing plant beds and studies percentages through growth rates. Her homework? Growing a number gardens at home.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> The library's \\\"Maker Space\\\" teaches history through creation. Kids built mini Roman aqueducts last week using recycled items. Next up. recreating Leonardo da Vinci's inventions.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('16', 'e,d,c,b,a')\\\">Check</button><span id=\\\"fb-16\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-16\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: e - d - c - b - a</div></div><div style=\\\"margin-bottom:30px\\\"><strong>Question 17.</strong> Drag/Drop:<ul class=\\\"sortable-list\\\" id=\\\"sortable-17\\\"><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"b\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>b.</b> World Bank projects showcase Vietnamese innovation. Mountain communities use smartphones to predict weather patterns, blending ancient farming wisdom with modern technology. Their success stories travel far.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> ASEAN sees Vietnam differently now. Our tech startups mentor Singapore peers, while Hanoi's street food culture inspires Southeast Asian food safety standards. Small steps, regional impact.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> In WHO forums, our traditional medicine meets modern science. Grandmother's ancient herbs are studied in global labs, while Vietnamese doctors share pandemic lessons that saved thousands of lives with minimal resources.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> From WTO markets to the Olympic games, Vietnam's presence has grown stronger. Our young athletes train with international teams, while village craftsmen sell ceramics online to New York galleries. The world gets smaller, opportunities get bigger.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"e\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>e.</b> Once a quiet player, Vietnam now chairs UN meetings with confidence. Last month, our proposal for sustainable rice farming practices caught global attention, turning Mekong Delta wisdom into international solutions.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('17', 'e,d,a,b,c')\\\">Check</button><span id=\\\"fb-17\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-17\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: e - d - a - b - c</div></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 4: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">Not until the late 20th century  <span class=\\\"gap-btn\\\" id=\\\"gap-4-18\\\" onclick=\\\"showGapOptions(event, '4', '18')\\\">(18)</span> . Neural networks, which form the foundation of our learning abilities, can be strengthened through consistent practice and exposure to new experiences. The brain actively rewires itself during learning processes; moreover, it creates new neural pathways to accommodate complex information. Neuroscientists have discovered revolutionary learning techniques, and they continue to explore the boundaries of human cognitive potential. Understanding the principles of neuroplasticity and  <span class=\\\"gap-btn\\\" id=\\\"gap-4-19\\\" onclick=\\\"showGapOptions(event, '4', '19')\\\">(19)</span> .<br>This revolutionary understanding of brain plasticity has transformed education and rehabilitation methods. People  <span class=\\\"gap-btn\\\" id=\\\"gap-4-20\\\" onclick=\\\"showGapOptions(event, '4', '20')\\\">(20)</span>  that lead to stronger abilities that enhance problem-solving and creative thinking. As we continue to unravel the mysteries of neural plasticity, the potential for human cognitive enhancement seems boundless, promising a future where learning truly becomes a transformative superpower.  <span class=\\\"gap-btn\\\" id=\\\"gap-4-21\\\" onclick=\\\"showGapOptions(event, '4', '21')\\\">(21)</span> . From stroke recovery to skill <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acquisition')\\\">acquisition</span> in adulthood, the brain's adaptability offers hope for continuous growth and improvement throughout life. Advanced neuroimaging techniques have revealed that even brief learning sessions can trigger measurable changes in brain structure and function. This understanding has <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('revolutionized')\\\">revolutionized</span> therapeutic approaches and learning methodologies, suggesting that with the right strategies and persistence, individuals can reshape their cognitive capabilities at any age.  <span class=\\\"gap-btn\\\" id=\\\"gap-4-22\\\" onclick=\\\"showGapOptions(event, '4', '22')\\\">(22)</span> . These groundbreaking discoveries continue to inspire researchers and educators worldwide, fostering innovative approaches to learning and cognitive development.<br></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 5: Reading</h3>\\n                        <button class=\\\"fullscreen-btn\\\" onclick=\\\"toggleFullScreenReading(this)\\\">⛶ Full Screen</button>\\n                    </div>\\n                    <div class=\\\"reading-container\\\" id=\\\"reading-5\\\"><div class=\\\"reading-left\\\">In today's digital age, the ability to <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('instantly')\\\">instantly</span> access and acquire knowledge has transformed the way we learn and process information. This phenomenon, which some call \\\"digital <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('sorcery')\\\">sorcery</span>,\\\" has <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('revolutionized')\\\">revolutionized</span> education and professional development in <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('unprecedented')\\\">unprecedented</span> ways. Through smartphones, tablets, and computers, we can tap into vast <b>repositories</b> of information within seconds, making knowledge <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acquisition')\\\">acquisition</span> more efficient than ever before.<br><br>The impact of instant knowledge <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acquisition')\\\">acquisition</span> on cognitive development has been both beneficial and <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('concerning')\\\">concerning</span>. While <b>it</b> enhances our capability to quickly find solutions and learn new concepts, some experts argue that it may <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('diminish')\\\">diminish</span> our capacity for deep thinking and critical <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('analysis')\\\">analysis</span>. Studies have shown that individuals who rely heavily on digital resources for immediate answers often struggle with <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('retention')\\\">retention</span>. However, when properly balanced with traditional learning methods, digital tools can significantly <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('accelerate')\\\">accelerate</span> the learning process.<br><br>The integration of artificial intelligence and machine learning into knowledge <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acquisition')\\\">acquisition</span> platforms has created even more <b>sophisticated</b> ways of learning. These technologies can now analyze learning patterns, adapt to individual needs, and provide <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('personalized')\\\">personalized</span> educational experiences. For instance, adaptive learning systems can identify knowledge gaps and automatically <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('adjust')\\\">adjust</span> content difficulty, making the learning process more efficient. This technological advancement has made it possible for people to <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('master')\\\">master</span> complex subjects in remarkably shorter periods.<br><br><b>Despite these advantages, maintaining a healthy relationship with digital knowledge <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acquisition')\\\">acquisition</span> requires <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('discipline')\\\">discipline</span> and awareness</b>. It's crucial to develop skills in <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('evaluating')\\\">evaluating</span> information quality and <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('reliability')\\\">reliability</span> in the digital space. Furthermore, experts recommend combining quick digital references with deeper study sessions to ensure <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('comprehensive')\\\">comprehensive</span> understanding. This balanced approach allows learners to harness the power of instant knowledge while developing crucial analytical and critical thinking skills that remain essential in the digital age.<br><br></div><div class=\\\"reading-right\\\"><div class=\\\"mcq-question\\\"><b>Question 23.</b> Which of the following is NOT mentioned as a benefit of digital knowledge acquisition?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '23', 'A')\\\"> A. Faster access to information repositories</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '23', 'B')\\\"> B. Enhanced memory retention capabilities</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '23', 'C')\\\"> C. Personalized learning experiences through AI</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '23', 'D')\\\"> D. Efficient solution finding</label></div><div id=\\\"res-5-23\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 24.</b> The word “repositories” in paragraph 1 is OPPOSITE in meaning to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '24', 'A')\\\"> A. collections</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '24', 'B')\\\"> B. scarcities</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '24', 'C')\\\"> C. databases</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '24', 'D')\\\"> D. archives</label></div><div id=\\\"res-5-24\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 25.</b> The word “it” in paragraph 2 refers to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '25', 'A')\\\"> A. cognitive development</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '25', 'B')\\\"> B. digital age</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '25', 'C')\\\"> C. learning process</label><label><input typ pe=\\\"radio\\\" name=\\\"q30\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '30', 'A')\\\"> A. Paragraph 1</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '30', 'B')\\\"> B. Paragraph 2</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '30', 'C')\\\"> C. Paragraph 3</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '30', 'D')\\\"> D. Paragraph 4</label></div><div id=\\\"res-5-30\\\" style=\\\"margin-top:5px\\\"></div></div></div></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 6: Reading</h3>\\n                        <button class=\\\"fullscreen-btn\\\" onclick=\\\"toggleFullScreenReading(this)\\\">⛶ Full Screen</button>\\n                    </div>\\n                    <div class=\\\"reading-container\\\" id=\\\"reading-6\\\"><div class=\\\"reading-left\\\">Vietnam has gone from <b>zero to hero</b> in its transformation from a war-torn nation to a dynamic economic <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('powerhouse')\\\">powerhouse</span>, standing as one of Asia's most remarkable success stories. Following the implementation of \\\"Doi Moi\\\" reforms in 1986, Vietnam began <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('dismantling')\\\">dismantling</span> its centrally planned economy, embracing market-oriented policies that would fundamentally reshape <b>its</b> economic landscape. This <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('pivotal')\\\">pivotal</span> shift marked the beginning of Vietnam's journey from isolation to international integration, setting the stage for decades of sustained growth and development.<br><br><b>[I] [II]</b>The <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('normalization')\\\">normalization</span> of etElementById('gap-popover'); \n            const uniqueKey = secId + '-' + id; \n            const o = DATA.gapOptions[uniqueKey]; \n            if(!o) return;\n            let h = \"\"; \n            for(let k in o) h += '<span class=\"popover-option\" onclick=\"selectGap(\\''+secId+'\\', \\''+id+'\\', \\''+k+'\\', \\''+o[k].replace(/'/g, \"\\\\'\")+'\\')\"><b>'+k+'.</b> '+o[k]+'</span>'; \n            p.innerHTML = h; p.style.display = 'block'; p.style.left = e.pageX + 'px'; p.style.top = (e.pageY + 20) + 'px'; \n            setTimeout(() => { document.addEventListener('click', function close(ev) { if (!p.contains(ev.target) && ev.target !== e.target) { p.style.display = 'none'; document.removeEventListener('click', close); } }); }, 0); \n        } \n\n        function selectGap(secId, qId, key, text) { \n            const btn = document.getElementById('gap-'+secId+'-'+qId); \n            if(!btn) return;\n            btn.innerText = text; btn.classList.add('filled'); \n            document.getElementById('gap-popover').style.display = 'none'; \n            \n            // CHECK KEY: Dùng secId-qId để tìm key trong kho\n            const fullKey = secId + '-' + qId;\n            if(allKeys[fullKey]) { \n                btn.style.borderColor = (key === allKeys[fullKey]) ? \"#22c55e\" : \"#ef4444\"; \n                btn.classList.remove('correct', 'wrong'); \n                if(key === allKeys[fullKey]) btn.classList.add('correct'); else btn.classList.add('wrong'); \n            } \n        } \n\n        function checkWordForm() { \n            const inputs = document.querySelectorAll('.word-form-input'); \n            inputs.forEach(inp => { \n                // ID input: wf-secId-qNum\n                const parts = inp.id.split('-');\n                const fullKey = parts[1] + '-' + parts[2];\n                \n                const userVal = inp.value.trim().toLowerCase(); \n                const correctKey = allKeys[fullKey] ? String(allKeys[fullKey]).trim().toLowerCase() : \"\"; \n                inp.classList.remove('correct', 'wrong'); \n                const parent = inp.parentNode; \n                const oldCorr = parent.querySelector('.correction-text'); \n                if(oldCorr) oldCorr.remove(); \n                if (!correctKey) return; \n                if (userVal === correctKey) { inp.classList.add('correct'); } \n                else { inp.classList.add('wrong'); const span = document.createElement('span'); span.className = 'correction-text'; span.innerHTML = '✓ ' + allKeys[fullKey]; if(inp.nextSibling) { parent.insertBefore(span, inp.nextSibling); } else { parent.appendChild(span); } } \n            }); \n        }\n\n        // HÀM CHECK MCQ MỚI (CHO BÀI READING)\n        function checkMCQ(secId, qId, selected) { \n            const resDiv = document.getElementById('res-'+secId+'-'+qId);\n            const fullKey = secId + '-' + qId;\n            resDiv.innerHTML = (allKeys[fullKey] && selected === allKeys[fullKey]) ? '<span style=\"color:#22c55e\">✓ Correct</span>' : '<span style=\"color:#ef4444\">✗ Incorrect</span>'; \n        }\n\n        // (GIỮ NGUYÊN CÁC HÀM KHÁC)\n        let dragSrcEl = null; function addDragEvents() { document.querySelectorAll('.sortable-item').forEach(item => { item.addEventListener('dragstart', function(e) { dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', this.innerHTML); }); item.addEventListener('dragover', function(e) { if (e.preventDefault) e.preventDefault(); return false; }); item.addEventListener('drop', function(e) { if (e.stopPropagation) e.stopPropagation(); if (dragSrcEl !== this) { const srcHTML = dragSrcEl.innerHTML; const srcId = dragSrcEl.dataset.sid; dragSrcEl.innerHTML = this.innerHTML; dragSrcEl.dataset.sid = this.dataset.sid; this.innerHTML = srcHTML; this.dataset.sid = srcId; } return false; }); }); } window.onload = function() { addDragEvents(); }; \n        function checkOrder(qId, targetStr) { const list = document.getElementById('sortable-'+qId); const current = Array.from(list.getElementsByTagName('li')).map(li => li.dataset.sid); const ans = document.getElementById('ans-'+qId); const fb = document.getElementById('fb-'+qId); if(JSON.stringify(current) === JSON.stringify(targetStr.split(','))) { fb.innerHTML = '<span style=\"color:#22c55e\">✓ Correct!</span>'; ans.style.display = 'none'; } else { fb.innerHTML = '<span style=\"color:#ef4444\">✗ Incorrect</span>'; ans.style.display = 'block'; } } \n        function showVocabDef(key) { const d = DATA.vocabMap[key.toLowerCase()]; if(!d) return; document.getElementById('v-word').innerText = d.original; document.getElementById('v-meaning').innerText = d.meaning; document.getElementById('v-synonym').innerText = d.synonyms ? 'Synonyms: ' + d.synonyms : ''; document.getElementById('v-example').innerText = d.example ? 'Ex: ' + d.example : ''; document.getElementById('vocab-modal').style.display = 'block'; document.querySelector('.overlay').style.display = 'block'; } \n        function closeVocabModal() { document.getElementById('vocab-modal').style.display = 'none'; document.querySelector('.overlay').style.display = 'none'; }\n        function toggleFullScreenReading(btn) { const r = btn.closest('.section-box'); r.classList.toggle('fullscreen-reading'); btn.innerText = r.classList.contains('fullscreen-reading') ? '🗗 Exit Full Screen' : '⛶ Full Screen'; }\n\n        // GAME LOGIC\n        let pairs=[], gameState={engOrder:[],shuffledVie:[],matches:{},score:0};\n        const engListEl=document.getElementById('engList'), vieListEl=document.getElementById('vieList'), scoreEl=document.getElementById('score'), confettiEl=document.getElementById('confetti');\n        function loadPairsFromMap(){ pairs = []; for(let k in DATA.vocabMap){ pairs.push({eng: DATA.vocabMap[k].original, vie: DATA.vocabMap[k].meaning}); } }\n        window.openVocabGame = function() { loadPairsFromMap(); if(pairs.length===0){ alert(\"Không có từ vựng nào!\"); return; } document.getElementById('vocab-game-overlay').style.display='block'; initGame(); }\n        window.closeVocabGame = function() { document.getElementById('vocab-game-overlay').style.display='none'; }\n        function shuffleArray(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }\n        function initGame(){ gameState.matches={}; gameState.score=0; gameState.engOrder=shuffleArray(pairs.map((_,i)=>i)); gameState.shuffledVie=shuffleArray(pairs.map(p=>p.vie)); renderGameEng(); renderGameVie(); attachGameSlotEvents(); updateGameScore(); initFlashcards(); renderFillList(); }\n        function renderGameEng(){ engListEl.innerHTML=''; gameState.engOrder.forEach((o,p)=>{ const x=pairs[o]; const i=document.createElement('div'); i.className='game-eng-item'; i.innerHTML='<div class=\"game-eng-left\"><div class=\"game-index\">'+(p+1)+'</div><div><div style=\"font-weight:700\">'+x.eng+'</div></div></div><div class=\"game-slot\" data-index=\"'+o+'\" tabindex=\"0\"><div class=\"inner\"></div></div>'; engListEl.appendChild(i); }); }\n        function renderGameVie(){ vieListEl.innerHTML=''; gameState.shuffledVie.forEach((t,i)=>{ const d=document.createElement('div'); d.className='game-vie-item'; d.draggable=true; d.dataset.text=t; d.innerHTML='<span style=\"font-weight:600\">'+t+'</span>'; vieListEl.appendChild(d); d.addEventListener('dragstart',e=>{d.classList.add('dragging');e.dataTransfer.setData('text/plain',t);window.currentPicked={text:t,el:d}}); d.addEventListener('dragend',()=>d.classList.remove('dragging')); d.addEventListener('click',()=>{if(window.currentPicked&&window.currentPicked.el===d){window.currentPicked=null;d.style.outline=''}else{if(window.currentPicked)window.currentPicked.el.style.outline='';window.currentPicked={text:t,el:d};d.style.outline='2px solid rgba(6,182,212,0.8)'}}); }); }\n        function attachGameSlotEvents(){ document.querySelectorAll('.game-slot').forEach(s=>{ s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('active')}); s.addEventListener('dragleave',()=>s.classList.remove('active')); s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('active');const t=e.dataTransfer.getData('text/plain');handleGameDrop(s,t)}); s.addEventListener('click',()=>{if(window.currentPicked)handleGameDrop(s,window.currentPicked.text)}); }); }\n        function handleGameDrop(s,t){ const i=Number(s.dataset.index); const c=pairs[i].vie; if(gameState.matches[i])return; if(t===c){ s.classList.add('correct'); s.innerHTML='<div class=\"inner\"><span style=\"font-weight:700;color:var(--success)\">'+t+'</span></div>'; gameState.matches[i]=t; gameState.score++; updateGameScore(); celebrate(); speak(pairs[i].eng); const el=Array.from(document.querySelectorAll('.game-vie-item')).find(x=>x.dataset.text===t); if(el)el.remove(); window.currentPicked=null; }else{ s.classList.add('game-wrong'); setTimeout(()=>s.classList.remove('game-wrong'),400); } }\n        function updateGameScore(){ scoreEl.innerHTML='Đúng: <strong>'+gameState.score+'</strong> / '+pairs.length; }\n        function celebrate(){ const c=['#06b6d4','#f97316','#f43f5e','#10b981']; for(let i=0;i<15;i++){ const p=document.createElement('div'); p.className='piece'; p.style.left=Math.random()*100+'%'; p.style.background=c[Math.floor(Math.random()*c.length)]; confettiEl.appendChild(p); setTimeout(()=>p.remove(),1500); } }\n        function speak(t){ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.speak(u); } }\n        let flashIndex=0;\n        function initFlashcards(){ flashIndex=0; renderFlash(); }\n        function renderFlash(){ if(!pairs.length)return; const p=pairs[flashIndex]; document.getElementById('flashFront').textContent=p.eng; document.getElementById('flashBack').textContent=p.vie; document.getElementById('flashcard').classList.remove('flipped'); }\n        document.getElementById('nextCard').addEventListener('click',()=>{flashIndex=(flashIndex+1)%pairs.length;renderFlash()}); document.getElementById('prevCard').addEventListener('click',()=>{flashIndex=(flashIndex-1+pairs.length)%pairs.length;renderFlash()}); document.getElementById('flipCard').addEventListener('click',()=>document.getElementById('flashcard').classList.toggle('flipped'));\n        const fillListEl=document.getElementById('fillList'), fillScoreEl=document.getElementById('fillScore');\n        function renderFillList(){ fillListEl.innerHTML=''; pairs.forEach((p,i)=>{ const r=document.createElement('div'); r.className='fill-row'; r.innerHTML='<div class=\"vie\">'+p.vie+'</div><input type=\"text\" data-index=\"'+i+'\" placeholder=\"...\" /><div class=\"game-small\" style=\"min-width:60px\" id=\"hint-'+i+'\"></div>'; fillListEl.appendChild(r); }); fillScoreEl.textContent='Điểm: 0 / '+pairs.length; }\n        document.getElementById('checkFill').addEventListener('click',()=>{ let c=0; pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); if(inp.value.trim().toLowerCase()===p.eng.toLowerCase()){c++;inp.classList.add('correct');}else{inp.classList.add('wrong');} }); fillScoreEl.textContent='Điểm: '+c+' / '+pairs.length; });\n        document.getElementById('showAnswers').addEventListener('click',()=>{ pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); inp.value=p.eng; inp.classList.add('correct'); }); });\n        document.getElementById('resetFill').addEventListener('click', renderFillList);\n        document.getElementById('shuffleBtn').addEventListener('click',()=>{gameState.matches={};gameState.score=0;gameState.engOrder=shuffleArray(gameState.engOrder);gameState.shuffledVie=shuffleArray(gameState.shuffledVie);renderGameEng();renderGameVie();attachGameSlotEvents();updateGameScore()});\n        document.getElementById('resetBtn').addEventListener('click',initGame);\n        <\/script>\n\t\t\n\t\t<script type=\"text/javascript\">var lbplugin_event_opt={\"extension_enable\":true,\"dict_type\":1,\"dbclk_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1},\"select_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1}};function loadScript(t,e){var n=document.createElement(\"script\");n.type=\"text/javascript\",n.readyState?n.onreadystatechange=function(){(\"loaded\"===n.readyState||\"complete\"===n.readyState)&&(n.onreadystatechange=null,e())}:n.onload=function(){e()},n.src=t,document.getElementsByTagName(\"head\")[0].appendChild(n)}setTimeout(function(){null==document.getElementById(\"lbdictex_find_popup\")&&loadScript(\"https://stc-laban.zdn.vn/dictionary/js/plugin/lbdictplugin.min.js?\"+Date.now()%1e4,function(){lbDictPlugin.init(lbplugin_event_opt)})},1e3);<\/script>\n\t\t\n\t\t</body></html>"},{"name":"(NEW) ĐỀ GK II LỚP 10 (5).html.html","filename":"(NEW) ĐỀ GK II LỚP 10 (5).html.html","content":"<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>English Practice</title><style>\n        :root { --primary: #2563eb; --success: #16a34a; --error: #dc2626; --bg: #f8fafc; --highlight: #fef08a; } body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; line-height: 1.8; } #main { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); } .section-box { margin-bottom: 50px; } .section-title { font-size: 1.4em; font-weight: bold; color: var(--primary); margin: 0 0 15px 0; } .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; } .gap-fill-text { font-size: 1.15em; text-align: justify; line-height: 1.8; } \n        .gap-btn { display: inline; background: transparent; border: none; border-bottom: 1px dotted #94a3b8; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0 2px; margin: 0 2px; font-size: inherit; font-family: inherit; transition: all 0.2s; } .gap-btn:hover { color: #1d4ed8; border-bottom-style: solid; } .gap-btn.filled { border-bottom: none; font-weight: bold; } .gap-btn.correct { color: var(--success) !important; } .gap-btn.wrong { color: var(--error) !important; text-decoration: line-through; }\n        .reading-container { display: flex; height: 650px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background:#fff; } .reading-left { flex: 1; padding: 25px; overflow-y: auto; background: #fff; border-right: 4px solid #f1f5f9; resize: horizontal; overflow-x: hidden; max-width: 70%; min-width: 30%; } .reading-right { flex: 1; padding: 25px; overflow-y: auto; background: #f8fafc; } .reading-left::-webkit-scrollbar, .reading-right::-webkit-scrollbar { width: 8px; } .reading-left::-webkit-scrollbar-track, .reading-right::-webkit-scrollbar-track { background: #f1f1f1; } .reading-left::-webkit-scrollbar-thumb, .reading-right::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } \n        .vocab-highlight { background-color: transparent; border-bottom: 2px dashed #f59e0b; cursor: help; padding: 0 1px; color: inherit; font-weight: 500; transition: all 0.2s; } .vocab-highlight:hover { background-color: #fffbeb; color: #d97706; }\n        .mcq-question { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; } .sortable-list { list-style: none; padding: 0; } .sortable-item { background: #fff; border: 1px solid #cbd5e1; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 15px; } .popover { position: absolute; background: white; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; padding: 10px; z-index: 1000; display: none; min-width: 250px; max-width: 400px; } .popover-option { display: block; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; } .popover-option:hover { background-color: #f8fafc; color: var(--primary); } .vocab-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 400px; border-radius: 16px; z-index: 10000; display: none; border: 1px solid #e2e8f0; overflow:hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); } .vocab-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2em; } .vocab-body { padding: 20px; } .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999; display: none; } button.action-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); } \n        .mcq-options label { display: block; margin: 8px 0; cursor: pointer; padding:8px; border-radius:4px; transition:background 0.2s } .mcq-options label:hover { background-color: #f1f5f9; }\n        .fullscreen-reading { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; } .fullscreen-reading .reading-container { flex: 1; height: auto !important; } .fullscreen-btn { float: right; padding: 5px 10px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; margin-bottom:5px; } .fullscreen-btn:hover { background: #334155; }\n        .btn-game { background: linear-gradient(90deg, #8b5cf6, #d946ef); color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-bottom:20px; }\n        .word-form-input { border: none; border-bottom: 2px solid #94a3b8; background: transparent; padding: 2px 5px; font-size: 1em; color: var(--primary); font-weight: bold; width: 150px; outline: none; transition: 0.3s; text-align: center; } .word-form-input:focus { border-bottom-color: var(--primary); background: #eff6ff; } .word-form-input.correct { border-bottom-color: var(--success); color: var(--success); background: #dcfce7; } .word-form-input.wrong { border-bottom-color: var(--error); color: var(--error); background: #fee2e2; text-decoration: line-through; } .correction-text { display: inline-block; margin-left: 8px; color: var(--success); font-weight: bold; font-size: 0.9em; background: #f0fdf4; padding: 2px 6px; border-radius: 4px; border: 1px solid #bbf7d0; }\n        @media (max-width: 768px) { .reading-container { flex-direction: column; height: auto; } .reading-left { resize: none; max-width: 100%; border-right: none; border-bottom: 4px solid #f1f5f9; max-height: 300px; } .vocab-modal { width: 90%; } }\n        \n        #vocab-game-overlay { position: fixed; inset: 0; z-index: 5000; background: #0f1724; display: none; overflow-y: auto; color: #e6eef6; }\n        #game-container { width:100%; max-width:1200px; margin: 0 auto; padding: 24px; }\n        .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }\n        .game-h1 { font-size:20px; margin:0; color:#06b6d4; }\n        .game-controls { display:flex; gap:8px; align-items:center; }\n        .game-btn { background:linear-gradient(90deg,#0ea5a4,#06b6d4); border:0; color:#042027; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }\n        .game-btn-close { background: #ef4444; color: white; }\n        .game-layout { display:flex; gap:18px; align-items:flex-start; overflow-x:auto; padding-bottom:6px; }\n        .game-card { flex: 0 0 48%; min-width:320px; box-sizing:border-box; padding:12px; background:rgba(255,255,255,0.02); border-radius:12px; border:1px solid rgba(255,255,255,0.03); max-height: calc(100vh - 180px); overflow:auto; }\n        .game-list { display:flex; flex-direction:column; gap:10px; }\n        .game-eng-item, .game-vie-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); color: #e6eef6; }\n        .game-eng-left { display:flex; align-items:center; gap:12px; flex: 0 0 220px; min-width:160px; }\n        .game-index { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; color:#94a3b8; font-weight:700; }\n        .game-slot { flex:1; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.01); border:2px dashed rgba(255,255,255,0.03); min-height:56px; transition:all 220ms ease; cursor:pointer; position:relative; overflow:visible; }\n        .game-slot .inner { position:relative; z-index:3; }\n        .game-slot.correct { padding-left:12px; font-size:15px; display:flex; align-items:center; border-style:solid; border-width:2px; background:linear-gradient(180deg, rgba(16,185,129,0.03), rgba(16,185,129,0.01)); }\n        .game-slot.correct::before { background: linear-gradient(90deg, rgba(16,185,129,0.9), rgba(96,165,250,0.06)); opacity:0.6; filter:blur(10px); }\n        .game-vie-list { display:flex; flex-wrap:wrap; gap:10px; padding-top:6px; }\n        .game-vie-item { cursor:grab; user-select:none; padding:8px 12px; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); }\n        .game-vie-item.dragging { opacity:0.5; transform:scale(0.98); }\n        .game-wrong { animation:shake 300ms; border-color:rgba(239,68,68,0.6); }\n        .game-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.02); color:#94a3b8; font-weight:600; }\n        .game-confetti { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:6000; }\n        .game-confetti .piece { position:absolute; width:10px; height:14px; opacity:0; animation:fall 1200ms linear forwards; }\n        .game-small { font-size:13px; color:#94a3b8; }\n        .flash-wrap { perspective:1200px; width:100%; max-width:520px; }\n        .flashcard { width:100%; height:140px; position:relative; transform-style:preserve-3d; transition:transform 600ms cubic-bezier(.2,.9,.3,1); border-radius:12px; cursor:pointer; }\n        .flashcard.flipped { transform:rotateY(180deg); }\n        .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:18px; font-size:18px; text-align:center; box-shadow: 0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03); }\n        .flash-face.front { background:linear-gradient(180deg, rgba(6,182,212,0.08), rgba(96,165,250,0.03)); color:#e6f9fb; }\n        .flash-face.back { transform:rotateY(180deg); background:linear-gradient(180deg, rgba(16,185,129,0.06), rgba(96,165,250,0.02)); color:#eafff0; }\n        .fill-list { display:flex; flex-direction:column; gap:10px; }\n        .fill-row { display:flex; gap:12px; align-items:center; }\n        .fill-row .vie { flex:0 0 48%; min-width:160px; color:#94a3b8; }\n        .fill-row input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); color:rgba(230,238,246,0.85); transition:all 180ms; }\n        .fill-row input.correct { border-color: rgba(16,185,129,0.7); background: rgba(16,185,129,0.02); }\n        .fill-row input.wrong { border-color: rgba(244,63,94,0.7); background: rgba(244,63,94,0.01); }\n        @keyframes shake{ 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)} }\n        @keyframes fall{ 0%{opacity:1; transform:translateY(-10vh) rotate(0deg)} 100%{opacity:1; transform:translateY(110vh) rotate(720deg)} }\n        @media (max-width:880px){ .game-layout{gr
