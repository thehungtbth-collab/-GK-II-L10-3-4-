ortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"c\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>c.</b> Picture Vietnam as the unexpected choreographer in the grand ballet of international diplomacy—once a reluctant performer, now directing bold new moves on the global stage.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"d\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>d.</b> Like a master weaver at an ancient loom, the country threads its economic silk through ASEAN, APEC, and WTO, creating a tapestry that transforms ancient trade routes into digital superhighways.</li><li class=\\\"sortable-item\\\" draggable=\\\"true\\\" data-sid=\\\"a\\\"><span class=\\\"drag-handle\\\" style=\\\"color:#94a3b8;font-weight:bold;font-size:1.2em\\\">☰</span> <b>a.</b> In the United Nations' great amphitheater, Vietnam's voice has evolved from a whisper to a resonant force, championing peace in lands far from its bamboo shores, while its diplomatic dragons dance gracefully through corridors of power from Geneva to New York.</li></ul><button class=\\\"action-btn btn-primary\\\" onclick=\\\"checkOrder('17', 'c,d,a,e,b')\\\">Check</button><span id=\\\"fb-17\\\" style=\\\"margin-left:10px\\\"></span><div id=\\\"ans-17\\\" style=\\\"display:none;color:#22c55e;margin-top:5px\\\">Correct: c - d - a - e - b</div></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 4: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">The human mind's capacity for learning across multiple dimensions represents one of the most fascinating aspects of cognitive science, which has been extensively studied by researchers worldwide. Not only does our brain process information through various channels simultaneously, but it also creates intricate networks of knowledge that interconnect in unexpected ways.  <span class=\\\"gap-btn\\\" id=\\\"gap-4-18\\\" onclick=\\\"showGapOptions(event, '4', '18')\\\">(18)</span> , we would not have developed the ability to master complex skills and abstract concepts.<br>The learning process,  <span class=\\\"gap-btn\\\" id=\\\"gap-4-19\\\" onclick=\\\"showGapOptions(event, '4', '19')\\\">(19)</span> , enables us to adapt to an ever-changing world while building upon existing knowledge structures.  <span class=\\\"gap-btn\\\" id=\\\"gap-4-20\\\" onclick=\\\"showGapOptions(event, '4', '20')\\\">(20)</span> . The brain's <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('remarkable')\\\">remarkable</span> ability to forge new connections while pruning unnecessary ones ensures optimal learning efficiency and knowledge retention.<br> <span class=\\\"gap-btn\\\" id=\\\"gap-4-21\\\" onclick=\\\"showGapOptions(event, '4', '21')\\\">(21)</span> . The researchers who dedicate their lives to studying these phenomena have discovered that the mind operates like a vast multiverse, creating parallel processing streams and interconnected networks of information.<br> <span class=\\\"gap-btn\\\" id=\\\"gap-4-22\\\" onclick=\\\"showGapOptions(event, '4', '22')\\\">(22)</span>  and embracing its multidimensional nature, educators and learners alike can develop more effective strategies for knowledge acquisition and retention. The mind, being both the architect and explorer of its own multiverse, continues to surprise us with its boundless potential for growth and adaptation, inspiring generations to unlock their cognitive potential through dedicated practice and continuous learning.<br></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 5: Reading</h3>\\n                        <button class=\\\"fullscreen-btn\\\" onclick=\\\"toggleFullScreenReading(this)\\\">⛶ Full Screen</button>\\n                    </div>\\n                    <div class=\\\"reading-container\\\" id=\\\"reading-5\\\"><div class=\\\"reading-left\\\">The Hanoi Protocol, <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('established')\\\">established</span> in 2024, marks a <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('groundbreaking')\\\">groundbreaking</span> shift in how nations approach international cooperation. This innovative framework introduces <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('comprehensive')\\\">comprehensive</span> guidelines for collaborative problem-solving among countries, particularly in addressing global challenges like climate change and public health crises. The protocol <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('emphasizes')\\\">emphasizes</span> <b>transparency</b>, mutual <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('accountability')\\\">accountability</span>, and equitable resource sharing, setting it apart from previous international agreements that often favored developed nations.<br><br>At <b>its</b> core, the protocol <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('mandates')\\\">mandates</span> regular multilateral consultations and establishes a robust <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('dispute')\\\">dispute</span>-resolution mechanism. Countries must engage in quarterly meetings to assess progress and adjust strategies accordingly. The protocol also requires extensive documentation and regular performance reviews from all participants. The framework introduces a \\\"capacity-building index\\\" that <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('determines')\\\">determines</span> how resources and technical assistance should be distributed among participating nations, ensuring developing countries receive adequate support while maintaining their autonomy in decision-making processes.<br><br>The implementation phase has shown <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('remarkable')\\\">remarkable</span> and promising results, with over 120 countries actively participating in various <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('initiatives')\\\">initiatives</span> under the protocol. Notable achievements include the establishment of regional knowledge-sharing hubs and the creation of a <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('comprehensive')\\\">comprehensive</span> global emergency response network, significantly enhancing the international community's ability to respond swiftly to emerging challenges. While some nations remain hesitant to fully commit, citing concerns about <b>sovereignty</b> and economic <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('implications')\\\">implications</span>, the majority have embraced the protocol's principles.<br><br><b>The protocol's dynamic framework and focus on shared <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('accountability')\\\">accountability</span> are proving <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('invaluable')\\\">invaluable</span> in our digital era</b>. Its innovative approach has sparked specialized frameworks in AI governance, digital innovation sharing, and cross-border research <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('initiatives')\\\">initiatives</span>. As nations increasingly embrace its principles, the protocol continues to evolve, integrating real-world insights and adapting to emerging global challenges. By 2030, industry analysts project it will become the <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('definitive')\\\">definitive</span> gold standard for international partnerships, sustainable development, and multi-stakeholder collaborations worldwide.<br><br></div><div class=\\\"reading-right\\\"><div class=\\\"mcq-question\\\"><b>Question 23.</b> Which of the following is NOT mentioned as a feature of the Hanoi Protocol?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '23', 'A')\\\"> A. Financial penalties for non-compliant nations</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '23', 'B')\\\"> B. Quarterly multilateral consultations</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '23', 'C')\\\"> C. A capacity-building index for resource distribution</label><label><input type=\\\"radio\\\" name=\\\"q23\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '23', 'D')\\\"> D. Regional knowledge-sharing hubs</label></div><div id=\\\"res-5-23\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 24.</b> The word “transparency” in paragraph 1 is OPPOSITE in meaning to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '24', 'A')\\\"> A. secrecy</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '24', 'B')\\\"> B. openness</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '24', 'C')\\\"> C. clarity</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '24', 'D')\\\"> D. honesty</label></div><div id=\\\"res-5-24\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 25.</b> The word “its” in paragraph 2 refers to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '25', 'A')\\\"> A. the framework's</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '25', 'B')\\\"> B. the protocol's</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '25', 'C')\\\"> C. the nation's</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '25', 'D')\\\"> D. the cooperation's</label></div><div id=\\\"res-5-25\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 26.</b> The word “sovereignty” in paragraph 3 could be best replaced by_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '26', 'A')\\\"> A. democracy</label><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '26', 'B')\\\"> B. economy</label><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '26', 'C')\\\"> C. leadership</label><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '26', 'D')\\\"> D. independence</label></div><div id=\\\"res-5-26\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 27.</b> Which of the following best paraphrases the underlined sentence in paragraph 4?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '27', 'A')\\\"> A. The modern structure and collective monitoring methods have enhanced global cooperation in the current period.</label><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '27', 'B')\\\"> B. The advanced platform and mutual oversight practices have improved international relations in recent decades.</label><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '27', 'C')\\\"> C. The flexible system and joint responsibility approach have become essential tools in today's technological world.</label><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '27', 'D')\\\"> D. The adaptive program and shared tracking processes have transformed digital partnerships in modern society.</label></div><div id=\\\"res-5-27\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 28.</b> Which of the following is TRUE according to the passage?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '28', 'A')\\\"> A. The protocol requires nations to participate in quarterly meetings and submit detailed reports on their performance.</label><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '28', 'B')\\\"> B. The protocol has been fully accepted by all nations with no concerns about economic impacts or national sovereignty.</label><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '28', 'C')\\\"> C. The protocol was designed to give developed nations more advantages in international resource-sharing programs.</label><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '28', 'D')\\\"> D. The protocol will cease its evolution by 2030 when it becomes the standard for international collaborations.</label></div><div id=\\\"res-5-28\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 29.</b> In which paragraph does the writer mention the creation of a comprehensive global emergency response network?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '29', 'A')\\\"> A. Paragraph 2</label><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '29', 'B')\\\"> B. Paragraph 3</label><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '29', 'C')\\\"> C. Paragraph 4</label><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '29', 'D')\\\"> D. Paragraph 1</label></div><div id=\\\"res-5-29\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 30.</b> In which paragraph does the writer mention what the protocol requires countries to do in terms of meetings?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('5', '30', 'A')\\\"> A. Paragraph 3</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('5', '30', 'B')\\\"> B. Paragraph 1</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('5', '30', 'C')\\\"> C. Paragraph 4</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('5', '30', 'D')\\\"> D. Paragraph 2</label></div><div id=\\\"res-5-30\\\" style=\\\"margin-top:5px\\\"></div></div></div></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 6: Reading</h3>\\n                        <button class=\\\"fullscreen-btn\\\" onclick=\\\"toggleFullScreenReading(this)\\\">⛶ Full Screen</button>\\n                    </div>\\n                    <div class=\\\"reading-container\\\" id=\\\"reading-6\\\"><div class=\\\"reading-left\\\"><b>[I]</b> In recent decades, society has turned over a new leaf in how we understand and express gender, shaking things up in <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('unprecedented')\\\">unprecedented</span> ways. <b>[II]</b> Traditional binary concepts of male and female are being challenged as people increasingly recognize gender as a <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('spectrum')\\\">spectrum</span> rather than a rigid dichotomy. <b>[III]</b> This shift has profound <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('implications')\\\">implications</span> for how we organize our social institutions, from education and healthcare to workplace policies and legal frameworks. <b>[IV]</b><br><br>The movement beyond gender norms has gained momentum through increased visibility of non-binary and <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('transgender')\\\">transgender</span> individuals in media and public life. Social media platforms have become powerful tools for sharing personal stories and building communities, while celebrities and public figures who challenge traditional gender expressions have helped <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('normalize')\\\">normalize</span> diverse gender identities. These changes have encouraged younger generations to explore and express <b>their</b> authentic selves without feeling confined by conventional gender roles. Moreover, grassroots movements and <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('advocacy')\\\">advocacy</span> groups have played a crucial role in raising awareness and promoting <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('acceptance')\\\">acceptance</span> of gender diversity in communities worldwide.<br><br>Scientific research has also contributed to our <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('evolving')\\\">evolving</span> understanding of gender identity. Studies in neuroscience and psychology have demonstrated that gender expression is influenced by complex interactions between biological, social, and cultural factors. This research challenges <b>simplistic</b> biological <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('determinism')\\\">determinism</span> and supports the view that gender identity exists on a continuum. Healthcare providers are increasingly adopting gender-affirming approaches, recognizing that supporting individuals in their gender expression leads to better mental health outcomes and overall well-being in both personal and professional spheres.<br><br>The <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('dismantling')\\\">dismantling</span> of gender norms has far-reaching <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('implications')\\\">implications</span> for society. <b>Workplaces are implementing more inclusive policies, schools are adapting their <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('curricula')\\\">curricula</span> and facilities, and governments are revising <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('legislation')\\\">legislation</span> to protect gender-diverse individuals</b>. Despite ongoing resistance from some quarters, the trend toward greater gender inclusivity appears irreversible. As society continues to evolve, we move closer to a future where individuals can freely express their gender identity without fear of <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('discrimination')\\\">discrimination</span> or <span class=\\\"vocab-highlight\\\" onclick=\\\"showVocabDef('prejudice')\\\">prejudice</span>.<br><br></div><div class=\\\"reading-right\\\"><div class=\\\"mcq-question\\\"><b>Question 31.</b> The phrase “shaking things up” in paragraph 1 could be best replaced by_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q31\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '31', 'A')\\\"> A. breaking down</label><label><input type=\\\"radio\\\" name=\\\"q31\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '31', 'B')\\\"> B. stirring up</label><label><input type=\\\"radio\\\" name=\\\"q31\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '31', 'C')\\\"> C. turning around</label><label><input type=\\\"radio\\\" name=\\\"q31\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '31', 'D')\\\"> D. bringing about</label></div><div id=\\\"res-6-31\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 32.</b> Where in paragraph 1 does the following sentence best fit?\\nThe impact of this evolution extends beyond individual expression to reshape fundamental aspects of human interaction and social development in modern society.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q32\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '32', 'A')\\\"> A. [I]</label><label><input type=\\\"radio\\\" name=\\\"q32\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '32', 'B')\\\"> B. [II]</label><label><input type=\\\"radio\\\" name=\\\"q32\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '32', 'C')\\\"> C. [III]</label><label><input type=\\\"radio\\\" name=\\\"q32\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '32', 'D')\\\"> D. [IV]</label></div><div id=\\\"res-6-32\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 33.</b> Which of the following is NOT mentioned as a factor influencing gender identity?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q33\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '33', 'A')\\\"> A. genetic inheritance</label><label><input type=\\\"radio\\\" name=\\\"q33\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '33', 'B')\\\"> B. biological factors</label><label><input type=\\\"radio\\\" name=\\\"q33\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '33', 'C')\\\"> C. social factors</label><label><input type=\\\"radio\\\" name=\\\"q33\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '33', 'D')\\\"> D. cultural factors</label></div><div id=\\\"res-6-33\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 34.</b> The word “their” in paragraph 2 refers to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q34\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '34', 'A')\\\"> A. social media platforms</label><label><input type=\\\"radio\\\" name=\\\"q34\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '34', 'B')\\\"> B. celebrities and public figures</label><label><input type=\\\"radio\\\" name=\\\"q34\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '34', 'C')\\\"> C. younger generations</label><label><input type=\\\"radio\\\" name=\\\"q34\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '34', 'D')\\\"> D. conventional gender roles</label></div><div id=\\\"res-6-34\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 35.</b> Which of the following best summarises the paragraph 2?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q35\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '35', 'A')\\\"> A. Digital media and grassroots activism have reshaped gender understanding, while younger generations embrace authentic self-expression freely.</label><label><input type=\\\"radio\\\" name=\\\"q35\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '35', 'B')\\\"> B. Media representation and social platforms have transformed public perception of gender identity, while advocacy groups promote community acceptance.</label><label><input type=\\\"radio\\\" name=\\\"q35\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '35', 'C')\\\"> C. Social movements and celebrity influence have changed gender expression norms, while digital platforms enhance personal story sharing globally.</label><label><input type=\\\"radio\\\" name=\\\"q35\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '35', 'D')\\\"> D. Public figures and community organizations have challenged gender traditions, while social networks facilitate identity-based connections widely.</label></div><div id=\\\"res-6-35\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 36.</b> The word “simplistic” in paragraph 3 is OPPOSITE in meaning to_________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q36\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '36', 'A')\\\"> A. basic</label><label><input type=\\\"radio\\\" name=\\\"q36\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '36', 'B')\\\"> B. complex</label><label><input type=\\\"radio\\\" name=\\\"q36\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '36', 'C')\\\"> C. elementary</label><label><input type=\\\"radio\\\" name=\\\"q36\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '36', 'D')\\\"> D. superficial</label></div><div id=\\\"res-6-36\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 37.</b> Which of the following is TRUE according to the passage?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q37\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '37', 'A')\\\"> A. Scientific research proves that gender identity is determined solely by biological factors in human development.</label><label><input type=\\\"radio\\\" name=\\\"q37\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '37', 'B')\\\"> B. Healthcare providers worldwide have fully implemented gender-affirming approaches in all medical facilities.</label><label><input type=\\\"radio\\\" name=\\\"q37\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '37', 'C')\\\"> C. The movement towards gender inclusivity has received universal acceptance without any social resistance.</label><label><input type=\\\"radio\\\" name=\\\"q37\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '37', 'D')\\\"> D. Social media and public figures have played a key role in normalizing diverse gender identities in society.</label></div><div id=\\\"res-6-37\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 38.</b> Which of the following best paraphrases the underlined sentence in paragraph 4?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q38\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '38', 'A')\\\"> A. Various institutions are modifying their operational frameworks to ensure equal treatment of all gender identities.</label><label><input type=\\\"radio\\\" name=\\\"q38\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '38', 'B')\\\"> B. Educational systems and corporate entities are leading social changes while governments observe the transition.</label><label><input type=\\\"radio\\\" name=\\\"q38\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '38', 'C')\\\"> C. Public and private sectors are gradually responding to demands for changes in traditional gender-based policies.</label><label><input type=\\\"radio\\\" name=\\\"q38\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '38', 'D')\\\"> D. Social organizations are independently developing strategies to address gender diversity in their environments.</label></div><div id=\\\"res-6-38\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 39.</b> Which of the following can be inferred from the passage?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q39\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '39', 'A')\\\"> A. The transformation of gender understanding will eventually eliminate all forms of gender-based discrimination.</label><label><input type=\\\"radio\\\" name=\\\"q39\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '39', 'B')\\\"> B. Future generations will completely abandon traditional gender roles in favor of a purely spectrum-based approach.</label><label><input type=\\\"radio\\\" name=\\\"q39\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '39', 'C')\\\"> C. The shift toward gender inclusivity will continue despite some opposition from traditional social institutions.</label><label><input type=\\\"radio\\\" name=\\\"q39\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '39', 'D')\\\"> D. Scientific research will ultimately prove that biological factors are the primary determinants of gender identity.</label></div><div id=\\\"res-6-39\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 40.</b> Which of the following best summarises the passage?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q40\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('6', '40', 'A')\\\"> A. Scientific research and healthcare providers are leading revolutionary changes in understanding gender identity.</label><label><input type=\\\"radio\\\" name=\\\"q40\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('6', '40', 'B')\\\"> B. Society's evolving view of gender as a spectrum is reshaping institutions and advancing toward an inclusive future.</label><label><input type=\\\"radio\\\" name=\\\"q40\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('6', '40', 'C')\\\"> C. Social media and celebrity influence have transformed traditional perspectives on gender expression globally.</label><label><input type=\\\"radio\\\" name=\\\"q40\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('6', '40', 'D')\\\"> D. Modern technology and grassroots movements are challenging historical binary concepts of gender expression.</label></div><div id=\\\"res-6-40\\\" style=\\\"margin-top:5px\\\"></div></div></div></div></div>\"}; const allKeys = DATA.keys; \n\n        // --- CÁC HÀM XỬ LÝ (ĐÃ UPDATE LOGIC KEY BIỆT LẬP) ---\n        function showGapOptions(e, secId, id) { \n            const p = document.getElementById('gap-popover'); \n            const uniqueKey = secId + '-' + id; \n            const o = DATA.gapOptions[uniqueKey]; \n            if(!o) return;\n            let h = \"\"; \n            for(let k in o) h += '<span class=\"popover-option\" onclick=\"selectGap(\\''+secId+'\\', \\''+id+'\\', \\''+k+'\\', \\''+o[k].replace(/'/g, \"\\\\'\")+'\\')\"><b>'+k+'.</b> '+o[k]+'</span>'; \n            p.innerHTML = h; p.style.display = 'block'; p.style.left = e.pageX + 'px'; p.style.top = (e.pageY + 20) + 'px'; \n            setTimeout(() => { document.addEventListener('click', function close(ev) { if (!p.contains(ev.target) && ev.target !== e.target) { p.style.display = 'none'; document.removeEventListener('click', close); } }); }, 0); \n        } \n\n        function selectGap(secId, qId, key, text) { \n            const btn = document.getElementById('gap-'+secId+'-'+qId); \n            if(!btn) return;\n            btn.innerText = text; btn.classList.add('filled'); \n            document.getElementById('gap-popover').style.display = 'none'; \n            \n            // CHECK KEY: Dùng secId-qId để tìm key trong kho\n            const fullKey = secId + '-' + qId;\n            if(allKeys[fullKey]) { \n                btn.style.borderColor = (key === allKeys[fullKey]) ? \"#22c55e\" : \"#ef4444\"; \n                btn.classList.remove('correct', 'wrong'); \n                if(key === allKeys[fullKey]) btn.classList.add('correct'); else btn.classList.add('wrong'); \n            } \n        } \n\n        function checkWordForm() { \n            const inputs = document.querySelectorAll('.word-form-input'); \n            inputs.forEach(inp => { \n                // ID input: wf-secId-qNum\n                const parts = inp.id.split('-');\n                const fullKey = parts[1] + '-' + parts[2];\n                \n                const userVal = inp.value.trim().toLowerCase(); \n                const correctKey = allKeys[fullKey] ? String(allKeys[fullKey]).trim().toLowerCase() : \"\"; \n                inp.classList.remove('correct', 'wrong'); \n                const parent = inp.parentNode; \n                const oldCorr = parent.querySelector('.correction-text'); \n                if(oldCorr) oldCorr.remove(); \n                if (!correctKey) return; \n                if (userVal === correctKey) { inp.classList.add('correct'); } \n                else { inp.classList.add('wrong'); const span = document.createElement('span'); span.className = 'correction-text'; span.innerHTML = '✓ ' + allKeys[fullKey]; if(inp.nextSibling) { parent.insertBefore(span, inp.nextSibling); } else { parent.appendChild(span); } } \n            }); \n        }\n\n        // HÀM CHECK MCQ MỚI (CHO BÀI READING)\n        function checkMCQ(secId, qId, selected) { \n            const resDiv = document.getElementById('res-'+secId+'-'+qId);\n            const fullKey = secId + '-' + qId;\n            resDiv.innerHTML = (allKeys[fullKey] && selected === allKeys[fullKey]) ? '<span style=\"color:#22c55e\">✓ Correct</span>' : '<span style=\"color:#ef4444\">✗ Incorrect</span>'; \n        }\n\n        // (GIỮ NGUYÊN CÁC HÀM KHÁC)\n        let dragSrcEl = null; function addDragEvents() { document.querySelectorAll('.sortable-item').forEach(item => { item.addEventListener('dragstart', function(e) { dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', this.innerHTML); }); item.addEventListener('dragover', function(e) { if (e.preventDefault) e.preventDefault(); return false; }); item.addEventListener('drop', function(e) { if (e.stopPropagation) e.stopPropagation(); if (dragSrcEl !== this) { const srcHTML = dragSrcEl.innerHTML; const srcId = dragSrcEl.dataset.sid; dragSrcEl.innerHTML = this.innerHTML; dragSrcEl.dataset.sid = this.dataset.sid; this.innerHTML = srcHTML; this.dataset.sid = srcId; } return false; }); }); } window.onload = function() { addDragEvents(); }; \n        function checkOrder(qId, targetStr) { const list = document.getElementById('sortable-'+qId); const current = Array.from(list.getElementsByTagName('li')).map(li => li.dataset.sid); const ans = document.getElementById('ans-'+qId); const fb = document.getElementById('fb-'+qId); if(JSON.stringify(current) === JSON.stringify(targetStr.split(','))) { fb.innerHTML = '<span style=\"color:#22c55e\">✓ Correct!</span>'; ans.style.display = 'none'; } else { fb.innerHTML = '<span style=\"color:#ef4444\">✗ Incorrect</span>'; ans.style.display = 'block'; } } \n        function showVocabDef(key) { const d = DATA.vocabMap[key.toLowerCase()]; if(!d) return; document.getElementById('v-word').innerText = d.original; document.getElementById('v-meaning').innerText = d.meaning; document.getElementById('v-synonym').innerText = d.synonyms ? 'Synonyms: ' + d.synonyms : ''; document.getElementById('v-example').innerText = d.example ? 'Ex: ' + d.example : ''; document.getElementById('vocab-modal').style.display = 'block'; document.querySelector('.overlay').style.display = 'block'; } \n        function closeVocabModal() { document.getElementById('vocab-modal').style.display = 'none'; document.querySelector('.overlay').style.display = 'none'; }\n        function toggleFullScreenReading(btn) { const r = btn.closest('.section-box'); r.classList.toggle('fullscreen-reading'); btn.innerText = r.classList.contains('fullscreen-reading') ? '🗗 Exit Full Screen' : '⛶ Full Screen'; }\n\n        // GAME LOGIC\n        let pairs=[], gameState={engOrder:[],shuffledVie:[],matches:{},score:0};\n        const engListEl=document.getElementById('engList'), vieListEl=document.getElementById('vieList'), scoreEl=document.getElementById('score'), confettiEl=document.getElementById('confetti');\n        function loadPairsFromMap(){ pairs = []; for(let k in DATA.vocabMap){ pairs.push({eng: DATA.vocabMap[k].original, vie: DATA.vocabMap[k].meaning}); } }\n        window.openVocabGame = function() { loadPairsFromMap(); if(pairs.length===0){ alert(\"Không có từ vựng nào!\"); return; } document.getElementById('vocab-game-overlay').style.display='block'; initGame(); }\n        window.closeVocabGame = function() { document.getElementById('vocab-game-overlay').style.display='none'; }\n        function shuffleArray(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }\n        function initGame(){ gameState.matches={}; gameState.score=0; gameState.engOrder=shuffleArray(pairs.map((_,i)=>i)); gameState.shuffledVie=shuffleArray(pairs.map(p=>p.vie)); renderGameEng(); renderGameVie(); attachGameSlotEvents(); updateGameScore(); initFlashcards(); renderFillList(); }\n        function renderGameEng(){ engListEl.innerHTML=''; gameState.engOrder.forEach((o,p)=>{ const x=pairs[o]; const i=document.createElement('div'); i.className='game-eng-item'; i.innerHTML='<div class=\"game-eng-left\"><div class=\"game-index\">'+(p+1)+'</div><div><div style=\"font-weight:700\">'+x.eng+'</div></div></div><div class=\"game-slot\" data-index=\"'+o+'\" tabindex=\"0\"><div class=\"inner\"></div></div>'; engListEl.appendChild(i); }); }\n        function renderGameVie(){ vieListEl.innerHTML=''; gameState.shuffledVie.forEach((t,i)=>{ const d=document.createElement('div'); d.className='game-vie-item'; d.draggable=true; d.dataset.text=t; d.innerHTML='<span style=\"font-weight:600\">'+t+'</span>'; vieListEl.appendChild(d); d.addEventListener('dragstart',e=>{d.classList.add('dragging');e.dataTransfer.setData('text/plain',t);window.currentPicked={text:t,el:d}}); d.addEventListener('dragend',()=>d.classList.remove('dragging')); d.addEventListener('click',()=>{if(window.currentPicked&&window.currentPicked.el===d){window.currentPicked=null;d.style.outline=''}else{if(window.currentPicked)window.currentPicked.el.style.outline='';window.currentPicked={text:t,el:d};d.style.outline='2px solid rgba(6,182,212,0.8)'}}); }); }\n        function attachGameSlotEvents(){ document.querySelectorAll('.game-slot').forEach(s=>{ s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('active')}); s.addEventListener('dragleave',()=>s.classList.remove('active')); s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('active');const t=e.dataTransfer.getData('text/plain');handleGameDrop(s,t)}); s.addEventListener('click',()=>{if(window.currentPicked)handleGameDrop(s,window.currentPicked.text)}); }); }\n        function handleGameDrop(s,t){ const i=Number(s.dataset.index); const c=pairs[i].vie; if(gameState.matches[i])return; if(t===c){ s.classList.add('correct'); s.innerHTML='<div class=\"inner\"><span style=\"font-weight:700;color:var(--success)\">'+t+'</span></div>'; gameState.matches[i]=t; gameState.score++; updateGameScore(); celebrate(); speak(pairs[i].eng); const el=Array.from(document.querySelectorAll('.game-vie-item')).find(x=>x.dataset.text===t); if(el)el.remove(); window.currentPicked=null; }else{ s.classList.add('game-wrong'); setTimeout(()=>s.classList.remove('game-wrong'),400); } }\n        function updateGameScore(){ scoreEl.innerHTML='Đúng: <strong>'+gameState.score+'</strong> / '+pairs.length; }\n        function celebrate(){ const c=['#06b6d4','#f97316','#f43f5e','#10b981']; for(let i=0;i<15;i++){ const p=document.createElement('div'); p.className='piece'; p.style.left=Math.random()*100+'%'; p.style.background=c[Math.floor(Math.random()*c.length)]; confettiEl.appendChild(p); setTimeout(()=>p.remove(),1500); } }\n        function speak(t){ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.speak(u); } }\n        let flashIndex=0;\n        function initFlashcards(){ flashIndex=0; renderFlash(); }\n        function renderFlash(){ if(!pairs.length)return; const p=pairs[flashIndex]; document.getElementById('flashFront').textContent=p.eng; document.getElementById('flashBack').textContent=p.vie; document.getElementById('flashcard').classList.remove('flipped'); }\n        document.getElementById('nextCard').addEventListener('click',()=>{flashIndex=(flashIndex+1)%pairs.length;renderFlash()}); document.getElementById('prevCard').addEventListener('click',()=>{flashIndex=(flashIndex-1+pairs.length)%pairs.length;renderFlash()}); document.getElementById('flipCard').addEventListener('click',()=>document.getElementById('flashcard').classList.toggle('flipped'));\n        const fillListEl=document.getElementById('fillList'), fillScoreEl=document.getElementById('fillScore');\n        function renderFillList(){ fillListEl.innerHTML=''; pairs.forEach((p,i)=>{ const r=document.createElement('div'); r.className='fill-row'; r.innerHTML='<div class=\"vie\">'+p.vie+'</div><input type=\"text\" data-index=\"'+i+'\" placeholder=\"...\" /><div class=\"game-small\" style=\"min-width:60px\" id=\"hint-'+i+'\"></div>'; fillListEl.appendChild(r); }); fillScoreEl.textContent='Điểm: 0 / '+pairs.length; }\n        document.getElementById('checkFill').addEventListener('click',()=>{ let c=0; pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); if(inp.value.trim().toLowerCase()===p.eng.toLowerCase()){c++;inp.classList.add('correct');}else{inp.classList.add('wrong');} }); fillScoreEl.textContent='Điểm: '+c+' / '+pairs.length; });\n        document.getElementById('showAnswers').addEventListener('click',()=>{ pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); inp.value=p.eng; inp.classList.add('correct'); }); });\n        document.getElementById('resetFill').addEventListener('click', renderFillList);\n        document.getElementById('shuffleBtn').addEventListener('click',()=>{gameState.matches={};gameState.score=0;gameState.engOrder=shuffleArray(gameState.engOrder);gameState.shuffledVie=shuffleArray(gameState.shuffledVie);renderGameEng();renderGameVie();attachGameSlotEvents();updateGameScore()});\n        document.getElementById('resetBtn').addEventListener('click',initGame);\n        <\/script>\n\t\t<script type=\"text/javascript\">var lbplugin_event_opt={\"extension_enable\":true,\"dict_type\":1,\"dbclk_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1},\"select_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1}};function loadScript(t,e){var n=document.createElement(\"script\");n.type=\"text/javascript\",n.readyState?n.onreadystatechange=function(){(\"loaded\"===n.readyState||\"complete\"===n.readyState)&&(n.onreadystatechange=null,e())}:n.onload=function(){e()},n.src=t,document.getElementsByTagName(\"head\")[0].appendChild(n)}setTimeout(function(){null==document.getElementById(\"lbdictex_find_popup\")&&loadScript(\"https://stc-laban.zdn.vn/dictionary/js/plugin/lbdictplugin.min.js?\"+Date.now()%1e4,function(){lbDictPlugin.init(lbplugin_event_opt)})},1e3);<\/script>\n\t\t</body></html>"}];
    const select = document.getElementById('selectBai');
    const openBtn = document.getElementById('openBtn');
    const clearBtn = document.getElementById('clearBtn');
    const frame = document.getElementById('frame');
    const controlsBar = document.getElementById('controlsBar');

    // populate select
    items.forEach((it, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = it.name || it.filename || ('Bài ' + (idx+1));
      select.appendChild(opt);
    });

    function enterFullscreenMode() {
      // hide controls and expand iframe
      controlsBar.classList.add('hidden');
      frame.classList.add('fullscreen-frame');

      // create close button if chưa có
      if (!document.getElementById('closeFullscreen')) {
        const btn = document.createElement('button');
        btn.id = 'closeFullscreen';
        btn.textContent = 'Đóng toàn màn hình';
        btn.onclick = exitFullscreenMode;
        document.body.appendChild(btn);
      }
    }

    function exitFullscreenMode() {
      // restore controls and iframe
      controlsBar.classList.remove('hidden');
      frame.classList.remove('fullscreen-frame');
      const btn = document.getElementById('closeFullscreen');
      if (btn) btn.remove();
    }

    openBtn.onclick = () => {
      const v = select.value;
      if (v === '') {
        alert('Vui lòng chọn một bài.');
        return;
      }
      const it = items[+v];
      frame.srcdoc = it.content;

      // vào chế độ toàn màn hình
      enterFullscreenMode();
    };

    clearBtn.onclick = () => {
      select.value = '';
      frame.srcdoc = '<p>Chưa chọn bài</p>';
    };

    // allow Enter key to open when select focused
    select.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openBtn.click();
    });

    // Escape để thoát toàn màn hình
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        exitFullscreenMode();
      }
    });
  </script>
